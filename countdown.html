<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Countdown to the End of Fall</title>
<meta property="og:title" content="NOVA Countdown to the End of Fall">
<meta property="og:description" content="How long until the fall semester at NOVA is officially over.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b2545;--blue:#00539b;--sky:#4aa3df;--gold:#f2b31b;--purple:#500778;--paper:#f4f7fb;--ink:#13263d;--muted:#5b6f86}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  .top{background:var(--navy);color:#fff;padding:34px 18px 90px;text-align:center;position:relative;overflow:hidden}
  .mosaic{position:absolute;inset:0;opacity:.18;pointer-events:none}
  .top>*{position:relative}
  .kicker{font-family:Montserrat;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}
  h1{font-family:Montserrat;font-weight:800;font-size:clamp(1.8rem,6.5vw,3rem);margin:10px 0 6px;line-height:1.1}
  .top p{margin:0;opacity:.85}
  main{max-width:760px;margin:-64px auto 0;padding:0 16px 50px;position:relative}
  .card{background:#fff;border-radius:18px;box-shadow:0 12px 30px #0b254522;padding:22px;margin-bottom:18px}
  .clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;text-align:center}
  .unit{background:var(--paper);border-radius:14px;padding:14px 4px;border-bottom:4px solid var(--blue)}
  .unit:last-child{border-bottom-color:var(--gold)}
  .unit b{display:block;font-family:Montserrat;font-weight:800;font-size:clamp(1.7rem,7vw,2.6rem);color:var(--navy);line-height:1}
  .unit span{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  .target{text-align:center;margin:14px 0 0;color:var(--muted);font-size:.9rem}
  .bar{height:12px;background:#e3eaf3;border-radius:99px;overflow:hidden;margin-top:16px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sky),var(--gold))}
  .barlabel{text-align:center;font-size:.85rem;color:var(--muted);margin-top:6px}
  h2{font-family:Montserrat;font-weight:700;font-size:1.1rem;color:var(--navy);margin:0 0 12px}
  ol{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #e6edf5}
  li:first-child{border-top:0}
  .when{font-family:Montserrat;font-weight:700;color:var(--blue);font-size:.85rem;line-height:1.2}
  .what{font-weight:600}
  .what small{display:block;font-weight:400;color:var(--muted)}
  .status{font-family:Montserrat;font-weight:700;font-size:.8rem;color:var(--purple);text-align:right;white-space:nowrap}
  li.done{opacity:.45}
  li.now .status{color:#0b7a3e}
  footer{text-align:center;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <svg class="mosaic" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="#4aa3df"><path d="M0 0h60l-30 50z"/><path d="M120 0h70l-35 60z"/><path d="M260 0h80l-40 55z"/><path d="M40 140l50-40 40 60z"/><path d="M300 150l60-50 30 70z"/></g>
    <g fill="#f2b31b"><circle cx="350" cy="40" r="18"/><path d="M190 120h50v50h-50z"/><path d="M0 170l40-30v60z"/></g>
    <g fill="#ffffff"><path d="M80 60l40 30-40 30z"/><path d="M230 60h40l-20 40z"/></g>
  </svg>
  <div class="kicker">NOVA · Fall 2026</div>
  <h1>Countdown to the End of Fall</h1>
  <p>The Fall 2026 semester, counted down to the second.</p>
</div>
<main>
  <section class="card" aria-live="polite">
    <div class="clock">
      <div class="unit"><b id="d">0</b><span>days</span></div>
      <div class="unit"><b id="h">00</b><span>hours</span></div>
      <div class="unit"><b id="m">00</b><span>min</span></div>
      <div class="unit"><b id="s">00</b><span>sec</span></div>
    </div>
    <p class="target" id="target">Until final grades are in: Wednesday, December 16</p>
    <div class="bar" aria-hidden="true"><i id="prog" style="width:0"></i></div>
    <div class="barlabel" id="proglabel"></div>
  </section>
  <section class="card">
    <h2>The home stretch</h2>
    <ol id="list"></ol>
  </section>
  <footer>Times are Eastern. This page updates on its own.</footer>
</main>
<script>
  const at=(d,t)=>new Date(`2026-${d}T${t}:00-05:00`);
  const DEADLINE=at("12-16","23:59"), START=at("08-24","00:00");
  const items=[
    {when:"Nov 25 to 29", what:"Thanksgiving break", note:"A brief pause for pie.", start:at("11-25","00:00"), end:at("11-29","23:59")},
    {when:"Nov 30 to Dec 3", what:"Last full week of classes", note:"", start:at("11-30","00:00"), end:at("12-03","23:59")},
    {when:"Dec 7", what:"Last day of classes", note:"", start:at("12-07","00:00"), end:at("12-07","23:59")},
    {when:"Dec 8 to 14", what:"Final exams", note:"", start:at("12-08","00:00"), end:at("12-14","23:59")},
    {when:"Dec 16", what:"Grades due", note:"Then winter break begins.", start:at("12-16","00:00"), end:DEADLINE},
  ];
  const pad=n=>String(n).padStart(2,"0");
  const list=document.getElementById("list");
  items.forEach(it=>{const li=document.createElement("li");
    li.innerHTML=`<div class="when">${it.when}</div><div class="what">${it.what}${it.note?`<small>${it.note}</small>`:""}</div><div class="status"></div>`;
    list.appendChild(li); it.el=li;});
  function tick(){
    const now=new Date(), ms=Math.max(0,DEADLINE-now), t=Math.floor(ms/1000);
    d.textContent=Math.floor(t/86400); h.textContent=pad(Math.floor(t%86400/3600)); m.textContent=pad(Math.floor(t%3600/60)); s.textContent=pad(t%60);
    const pct=Math.min(100,Math.max(0,(now-START)/(DEADLINE-START)*100));
    prog.style.width=pct.toFixed(1)+"%";
    proglabel.textContent= ms===0 ? "Fall is done. Winter break has officially begun." : `The semester is ${pct.toFixed(0)}% done.`;
    items.forEach(it=>{const st=it.el.querySelector(".status"); it.el.classList.remove("now","done");
      if(now>it.end){it.el.classList.add("done");st.textContent="Done";}
      else if(now>=it.start){it.el.classList.add("now");st.textContent="Now";}
      else{const days=Math.ceil((it.start-now)/86400000);st.textContent=days===1?"Tomorrow":`In ${days} days`;}
    });
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
