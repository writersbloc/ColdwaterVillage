
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inference Trail: A Chillwater Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-top:#9c4fd0;
    --grad-mid:#5f7ada;
    --grad-base:#22c2af;
    --bg-card:#fdf8ef;
    --ice:#e9f3e9;
    --ice-line:#dfd9d5;
    --ink:#241d38;
    --ink-fixed:#241d38;
    --ink-soft:#666174;
    --purple:#8a3fbf;
    --purple-dark:#6e3299;
    --purple-text:#6e3299;
    --purple-pale:#f3ecf9;
    --mint:#1fb3a6;
    --mint-dark:#198f85;
    --mint-pale:#e9f7f6;
    --mint-text:#126860;
    --coral:#e9615a;
    --coral-dark:#ba4e48;
    --coral-pale:#fdefee;
    --coral-text:#a2443f;
    --gold:#e0a63e;
    --gold-dark:#b88831;
    --snow:#ffffff;
    --stage-border:#f0ebe4;
    --dot-neutral:#d6d1ce;
    --essay-hover:#1a1528;
    --mountain-fill:#18887a;
    --shadow: 0 12px 28px rgba(36,29,56,0.14);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --grad-top:#2c1b4a;
      --grad-mid:#1e2c52;
      --grad-base:#0d3d3a;
      --bg-card:#241d38;
      --ice:#332d46;
      --ice-line:#4b465c;
      --ink:#fdf8ef;
      --ink-soft:#aca9a3;
      --purple-pale:#3a2456;
      --purple-text:#bb90da;
      --mint-pale:#233b4e;
      --mint-text:#6dcec5;
      --coral-pale:#4f2c3f;
      --coral-text:#ee8883;
      --stage-border:#3a344c;
      --dot-neutral:#504a60;
      --shadow: 0 12px 28px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito Sans', sans-serif;
    background: linear-gradient(180deg, var(--grad-top) 0%, var(--grad-mid) 50%, var(--grad-base) 100%);
    background-attachment: fixed;
    color:var(--ink);
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  /* ---------- Masthead (shared header pattern) ---------- */
  header.masthead{
    position:sticky; top:0; z-index:10;
    background:rgba(36,29,56,.7);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, var(--purple), var(--mint)) 1;
    padding:.6rem clamp(1rem,3vw,2rem);
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    flex-wrap:wrap;
    margin:-28px -18px 22px;
  }
  .masthead-title{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    letter-spacing:.01em;
    font-size:clamp(1rem,2.4vw,1.4rem);
    line-height:1;
    color:#fff;
  }
  .masthead-sub{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:.75rem;
    letter-spacing:.04em;
    color:#e7dbf0;
    text-transform:uppercase;
    margin-top:.25rem;
  }
  .masthead-stage{
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:.8rem;
    color:#fff;
    border:1px solid rgba(255,255,255,.3);
    padding:.65rem .7rem;
    border-radius:999px;
    white-space:nowrap;
  }

  /* ---------- Trail header (signature element) ---------- */
  .trailhead{
    position:relative;
    background:linear-gradient(180deg, var(--grad-top) 0%, var(--grad-mid) 55%, var(--grad-base) 100%);
    border-radius: 28px;
    padding:26px 22px 18px;
    overflow:hidden;
    box-shadow: var(--shadow);
    margin-bottom:22px;
  }
  .trailhead .mountains{
    position:absolute; left:0; right:0; bottom:0; height:60%;
    opacity:0.9;
  }
  .trailhead-inner{position:relative; z-index:2;}
  .trail-title{
    font-family:'Baloo', sans-serif;
    color:#fff;
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:400;
    opacity:.92;
    margin:0 0 14px;
    text-align:center;
  }
  .trail-path{width:100%; height:auto; display:block;}
  .checkpoint-label{
    font-family:'Nunito Sans', sans-serif;
    font-weight:800;
    font-size:11px;
    fill:#ffffff;
    text-anchor:middle;
  }

  /* ---------- Content card ---------- */
  .stage-card{
    background:var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:30px 30px 28px;
    position:relative;
    border:1px solid var(--stage-border);
  }
  @media (max-width:600px){
    .stage-card{padding:22px 18px 22px;}
  }

  .eyebrow{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--mint-text);
    margin:0 0 6px;
  }
  h1.stage-title, h2.stage-title{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:clamp(24px,4vw,32px);
    margin:0 0 16px;
    color:var(--ink);
    line-height:1.15;
  }

  .speech-row{
    display:flex;
    gap:18px;
    align-items:flex-start;
    margin-bottom:22px;
  }
  .avatar-wrap{
    flex:0 0 auto;
    width:88px; height:110px;
    border-radius:22px;
    background:var(--ice);
    border:3px solid var(--snow);
    box-shadow:0 6px 16px rgba(22,48,58,0.12);
    overflow:hidden;
    display:block;
  }
  .avatar-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .bubble{
    flex:1 1 auto;
    background:var(--purple-pale);
    border-radius:18px 18px 18px 4px;
    padding:14px 18px;
    font-size:15.5px;
    line-height:1.55;
    color:var(--ink);
    position:relative;
  }
  .bubble b{color:var(--purple-text);}
  .speaker-name{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:13px;
    color:var(--purple-text);
    display:block;
    margin-bottom:3px;
    letter-spacing:.02em;
  }

  .character-hero{
    background:var(--mint); border-radius:16px; padding:20px; margin-bottom:1.2rem; color:#fff; overflow:auto;
  }
  .character-hero img{
    height:150px; width:150px; object-fit:cover; border-radius:14px; border:4px solid #fff;
    box-shadow:0 6px 16px rgba(0,0,0,.25); float:left; margin:0 18px 10px 0;
  }
  .character-hero h2{ margin:0 0 4px; font-family:'Baloo', sans-serif; font-weight:400; font-size:1.4rem; color:#fff; }
  .character-hero .character-tag{
    display:inline-block; margin:4px 0 8px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; font-size:12px; color:#fff;
  }
  .character-hero p{ font-size:14px; margin:6px 0 0; line-height:1.5; color:#fff; }

  .essay-link{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink-fixed);
    color:#fff !important;
    text-decoration:none;
    font-weight:400;
    font-family:'Baloo', sans-serif;
    font-size:14.5px;
    padding:11px 18px;
    border-radius:100px;
    margin:6px 0 4px;
    transition: transform .15s ease, background .15s ease;
  }
  .essay-link:hover{background:var(--essay-hover); transform:translateY(-1px);}

  .clue-block{
    background:var(--ice);
    border:1.5px solid var(--ice-line);
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .clue-quote{
    font-style:italic;
    color:var(--ink-soft);
    border-left:3px solid var(--mint);
    padding-left:12px;
    margin:10px 0 14px;
    font-size:14.5px;
  }
  .clue-q{
    font-weight:400;
    font-family:'Baloo', sans-serif;
    font-size:16.5px;
    margin:0 0 12px;
  }
  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-card);
    border:2px solid var(--ice-line);
    border-radius:12px;
    padding:11px 14px;
    cursor:pointer;
    font-size:14.5px;
    font-weight:600;
    transition: border-color .15s ease, background .15s ease;
    user-select:none;
  }
  .opt:hover{border-color:var(--purple);}
  .opt.selected{border-color:var(--purple); background:var(--purple-pale);}
  .opt.correct{border-color:var(--mint-dark); background:var(--mint-pale);}
  .opt.incorrect{border-color:var(--coral); background:var(--coral-pale);}
  .opt .dot{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--dot-neutral);
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900; color:#fff;
  }
  .opt.selected .dot{background:var(--purple); border-color:var(--purple);}
  .opt.correct .dot{background:var(--mint-dark); border-color:var(--mint-dark);}
  .opt.incorrect .dot{background:var(--coral); border-color:var(--coral);}

  .feedback{
    margin-top:12px;
    font-size:14px;
    padding:11px 14px;
    border-radius:10px;
    display:none;
    line-height:1.5;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--mint-pale); color:var(--mint-text);}
  .feedback.bad{background:var(--coral-pale); color:var(--coral-text);}

  textarea, input[type=text]{
    width:100%;
    font-family:'Nunito Sans', sans-serif;
    font-size:14.5px;
    border:2px solid var(--ice-line);
    border-radius:12px;
    padding:12px 14px;
    resize:vertical;
    color:var(--ink);
    background:var(--bg-card);
  }
  textarea:focus, input[type=text]:focus{outline:2px solid var(--purple); border-color:var(--purple);}
  label.field-label{
    font-weight:400;
    font-family:'Baloo', sans-serif;
    font-size:14px;
    display:block;
    margin:16px 0 8px;
  }

  .btn-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:26px; gap:12px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:15px;
    border:none;
    border-radius:100px;
    padding:13px 26px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
    color:#fff;
    box-shadow: 0 8px 18px rgba(138,63,191,0.35);
  }
  .btn-primary:hover{box-shadow:0 10px 22px rgba(138,63,191,0.45);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding:13px 10px;
  }
  .btn-ghost:hover{color:var(--ink);}

  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 2px;}
  .badge{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:12.5px;
    padding:6px 13px;
    border-radius:100px;
    background:var(--ice);
    color:var(--mint-text);
  }

  .passage-pick{
    display:grid; gap:12px; grid-template-columns: 1fr;
  }
  .passage-card{
    text-align:left;
    background:var(--bg-card);
    border:2px solid var(--ice-line);
    border-radius:14px;
    padding:15px 17px;
    cursor:pointer;
    font-family:'Nunito Sans', sans-serif;
  }
  .passage-card:hover{border-color:var(--purple);}
  .passage-card.selected{border-color:var(--purple); background:var(--purple-pale);}
  .passage-card .p-title{
    font-family:'Baloo', sans-serif; font-weight:400; font-size:14.5px; color:var(--ink);
    margin-bottom:4px;
  }
  .passage-card .p-body{font-size:13.5px; color:var(--ink-soft); font-style:italic; line-height:1.5;}

  .report-block{
    background:var(--ice);
    border:1.5px solid var(--ice-line);
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .report-label{
    font-family:'Baloo', sans-serif;
    font-weight:400; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--purple-text); margin-bottom:8px; display:block;
  }
  .score-hero{
    display:flex; align-items:center; gap:18px; margin-bottom:6px;
  }
  .score-num{
    font-family:'Baloo', sans-serif; font-weight:400; font-size:46px; color:var(--purple-text);
    line-height:1;
  }
  .score-sub{font-size:14px; color:var(--ink-soft); font-weight:700;}

  .progress-dim{opacity:.35; filter:grayscale(.4);}

  footer.credit{
    text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:26px; line-height:1.7;
  }
  footer.credit a{color:var(--purple-text);}

  .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--purple-text);
    font-family:'Baloo', sans-serif; font-weight:400; font-size:13.5px;
    display:inline-flex; align-items:center; gap:6px; padding:4px 0;
  }

  ::selection{background:var(--purple-pale);}

  @media (max-width:480px){
    .speech-row{flex-direction:column; align-items:center; text-align:center;}
    .bubble{border-radius:18px;}
  }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <div class="masthead-sub">Vol. 2 &mdash; The Inference Trail</div>
  </div>
  <div class="masthead-stage" id="mastheadStage"></div>
</header>
<div class="wrap">

  <div class="trailhead">
    <p class="trail-title">Expedition Assignment</p>
    <svg class="trail-path" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
      <!-- mountains -->
      <polygon points="0,150 60,70 120,150" style="fill:var(--mountain-fill)" opacity="0.55"/>
      <polygon points="90,150 170,50 250,150" style="fill:var(--mountain-fill)" opacity="0.45"/>
      <polygon points="560,150 640,55 720,150" style="fill:var(--mountain-fill)" opacity="0.45"/>
      <polygon points="660,150 740,68 800,150" style="fill:var(--mountain-fill)" opacity="0.55"/>
      <!-- trail line -->
      <path id="trailLine" d="M60,110 C160,60 220,130 320,90 S480,50 560,95 S680,70 740,105"
            fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.85"/>
      <!-- checkpoint nodes, positions approx along path -->
      <g id="cpNodes"></g>
    </svg>
  </div>

  <div id="stageCard" class="stage-card"></div>

  <footer class="credit">
    Reading: Laura Bolin Carroll, &ldquo;Backpacks vs. Briefcases: Steps toward Rhetorical Analysis,&rdquo; <i>Writing Spaces</i>, Vol. 1 (2010), CC BY-NC-SA.
  </footer>
</div>

<script>
const IMG_NUTMEG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Nutmeg.png";
const IMG_BERRY = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Berry.png";
const IMG_YETIHERO = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Mayor.png";
const IMG_YETIAVATAR = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Mayor.png";


const ESSAY_URL = "https://wacclearinghouse.org/docs/books/writingspaces1/carroll--backpacks-vs-briefcases.pdf";

const CHECKPOINTS = ["Basecamp","Scout the Terrain","Check Your Footprints","Blaze a New Trail","Trail Report"];

let state = {
  stage: 0, // 0 basecamp,1 scout,2 footprints,3 blaze,4 report
  scoutIndex: 0,
  scoutAnswers: {}, // idx -> {choice, correct}
  footAnswers: {},  // qid -> value
  passageChoice: null,
  rewrite: "",
  rewriteWhy: ""
};

let savedProgress = null; // snapshot of any prior saved state, offered as "resume" rather than auto-loaded

const STORAGE_KEY = "audience-trail-progress";

function freshState(){
  return {stage:0, scoutIndex:0, scoutAnswers:{}, footAnswers:{}, passageChoice:null, rewrite:"", rewriteWhy:""};
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      if(saved && saved.stage > 0){
        savedProgress = saved; // offer as a resume option, don't auto-jump into it
      }
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error("save failed", e); }
}
async function resetAll(){
  state = freshState();
  savedProgress = null;
  try{ await window.storage.delete(STORAGE_KEY); }catch(e){}
  render();
}

/* ---------------- SCOUT THE TERRAIN data ---------------- */
const SCOUT_CLUES = [
  {
    tag: "Opening scene",
    quote: "\u201cImagine the first day of class in first year composition at your university\u2026 the moment your professor walked in the room, you likely began analyzing her.\u201d",
    question: "Carroll opens by describing a scene from a specific kind of classroom. Who does this framing suggest she's picturing as her reader?",
    options: [
      {text:"A marketing professional studying consumer behavior", correct:false},
      {text:"A high school teacher preparing a lesson plan", correct:false},
      {text:"A student sitting in a first-year composition class", correct:true},
      {text:"A parent choosing a college for their child", correct:false}
    ],
    goodFeedback: "Right \u2014 she puts the reader directly in a first-year comp classroom, watching \u201cyour professor\u201d walk in. That's a strong signal about who she expects is turning these pages.",
    badFeedback: "Look again at the scene: it's staged inside a first-year composition classroom, and the reader is asked to picture their own professor walking in."
  },
  {
    tag: "Campus-life examples",
    quote: "\u201cYou might be very frustrated with your campus's requirement that all first-year students purchase a meal plan\u2026 the most appropriate audience would be the person/office on campus that oversees meal plans.\u201d",
    question: "Carroll reaches for this example to explain audience. What does the choice of example reveal?",
    options: [
      {text:"She's writing for university administrators who manage dining services", correct:false},
      {text:"She's writing for readers with no connection to a campus", correct:false},
      {text:"The example is randomly chosen and reveals nothing about audience", correct:false},
      {text:"She assumes readers live on a campus with meal plan policies \u2014 i.e., residential college students", correct:true}
    ],
    goodFeedback: "Exactly. She doesn't explain what a \u201cmeal plan requirement\u201d is \u2014 she assumes the reader already knows, because she's picturing a residential first-year student living that exact experience. If you commute, work off campus, or never had a meal plan, that's worth flagging: it's a real gap between her assumed audience and yours.",
    badFeedback: "Notice that Carroll never defines what a campus meal plan requirement is. Writers only skip that kind of explanation when they assume the reader already shares the experience."
  },
  {
    tag: "Direct address",
    quote: "\u201cWhen your teacher walked in on the first day of class, you probably didn't think to yourself, \u2018I think I'll do some rhetorical analysis on her clothing\u2026\u2019\u201d",
    question: "Carroll uses \u201cyou\u201d and \u201cyour teacher\u201d dozens of times rather than \u201cpeople\u201d or \u201creaders.\u201d What does this pattern of direct address suggest?",
    options: [
      {text:"It positions the reader as a student who currently has teachers and does assignments for them", correct:true},
      {text:"It's a stylistic accident with no real significance", correct:false},
      {text:"It's meant to address professional rhetoricians as colleagues", correct:false},
      {text:"It signals the piece is for a general adult audience outside school", correct:false}
    ],
    goodFeedback: "Right. Second-person address that keeps referring to \u201cyour teacher,\u201d \u201cyour instructor,\u201d and assignments handed to you assumes the reader is currently enrolled and being taught \u2014 not just anyone.",
    badFeedback: "Track how often \u201cyour teacher\u201d and \u201cyour instructor\u201d show up. That kind of possessive, repeated address usually signals who the writer imagines holding the page."
  },
  {
    tag: "The discussion questions",
    quote: "\u201c1. What are examples of rhetoric that you see or hear on a daily basis? \u2026 3. What is an example of a rhetorical situation that you have found yourself in?\u201d",
    question: "The essay ends with numbered discussion questions. What does including these tell you about the intended audience and use of the piece?",
    options: [
      {text:"It's meant to be read silently with no follow-up", correct:false},
      {text:"It's written for readers in a class, likely to be assigned and discussed with an instructor", correct:true},
      {text:"It's aimed at readers outside any educational setting", correct:false},
      {text:"The questions are for the author's own reflection, not the reader's", correct:false}
    ],
    goodFeedback: "Yes \u2014 discussion questions are a textbook/coursepack convention. Their presence signals this piece expects to be assigned reading, likely followed by class discussion or a written response.",
    badFeedback: "Think about where you usually encounter numbered discussion questions at the end of a reading \u2014 that convention points to a classroom-assignment context."
  }
];

/* ---------------- CHECK YOUR FOOTPRINTS data ---------------- */
const FOOT_QUESTIONS = [
  {
    id:"q1",
    text:"Are you currently taking (or about to take) a first-year composition / writing class?",
    options:["Yes","No, but I'm still in college","No, I'm not in college right now"]
  },
  {
    id:"q2",
    text:"Do examples like meal plans, dorm roommates, etc. match your day-to-day life? Or does your version of college look different in some ways?",
    options:["Yes, closely","Somewhat","Not really"]
  },
  {
    id:"q3",
    text:"Carroll pictures a fairly traditional path \u2014 fresh out of high school, straight into a first-year writing class. Does that match your path, or does yours look different (returning after time away, transferring in, working full-time alongside classes)?",
    options:["Yes, that's pretty much my path","Somewhat similar, some differences","No, my path looks quite different"]
  }
];

function scoreFootprints(){
  const vals = FOOT_QUESTIONS.map(q => state.footAnswers[q.id]);
  if(vals.some(v => v===undefined)) return null;
  const firstOptionCount = vals.filter((v,i)=> v===FOOT_QUESTIONS[i].options[0]).length;
  const lastOptionCount = vals.filter((v,i)=> v===FOOT_QUESTIONS[i].options[2]).length;
  if(firstOptionCount>=2) return {
    tier:"Fully on the trail",
    color:"var(--mint-dark)",
    text:"You match the audience Carroll is picturing almost exactly \u2014 a current student, in or near a comp classroom, for whom these campus examples land without translation."
  };
  if(lastOptionCount>=2) return {
    tier:"Off the marked trail",
    color:"var(--coral-dark)",
    text:"The campus-classroom framing Carroll relies on doesn't map onto your situation. You can still follow the argument, but you're reading as an outsider to her assumed audience \u2014 which is exactly the kind of gap this game asks you to notice."
  };
  return {
    tier:"Partway down the trail",
    color:"var(--purple-text)",
    text:"You share some ground with Carroll's intended reader \u2014 maybe the school context, maybe not the exact campus details \u2014 but you're not a perfect match. That partial overlap is worth naming specifically in your reflection."
  };
}

let lastPageKey = null;
function render(){
  renderTrailNodes();
  const mastheadStage = document.getElementById("mastheadStage");
  if(mastheadStage) mastheadStage.textContent = "Stage " + (state.stage+1) + " of " + CHECKPOINTS.length + " \u00b7 " + CHECKPOINTS[state.stage];
  const card = document.getElementById("stageCard");
  card.innerHTML = "";
  if(state.stage===0) card.appendChild(renderBasecamp());
  else if(state.stage===1) card.appendChild(renderScout());
  else if(state.stage===2) card.appendChild(renderFootprints());
  else if(state.stage===3) card.appendChild(renderBlaze());
  else card.appendChild(renderReport());
  const pageKey = state.stage + ":" + state.scoutIndex;
  if(pageKey !== lastPageKey){
    window.scrollTo({top:0, behavior:"instant"});
    lastPageKey = pageKey;
  }
}

function renderTrailNodes(){
  const svg = document.getElementById("trailLine");
  const g = document.getElementById("cpNodes");
  g.innerHTML = "";
  const pts = [[60,110],[230,96],[400,84],[570,93],[740,105]];
  pts.forEach((p,i)=>{
    const done = i <= state.stage;
    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx", p[0]);
    circle.setAttribute("cy", p[1]);
    circle.setAttribute("r", i===state.stage ? 11 : 8);
    circle.style.fill = done ? (i===state.stage ? "var(--gold)" : "#ffffff") : "rgba(255,255,255,0.35)";
    circle.setAttribute("stroke", i===state.stage ? "#ffffff" : "none");
    circle.setAttribute("stroke-width","3");
    g.appendChild(circle);
    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("x", p[0]);
    label.setAttribute("y", p[1] + (i%2===0 ? 24 : -16));
    label.setAttribute("class","checkpoint-label");
    label.textContent = CHECKPOINTS[i].length>14 ? CHECKPOINTS[i].split(" ")[0] : CHECKPOINTS[i];

}

function renderScout(){
  const wrap = document.createElement("div");
  const idx = state.scoutIndex;
  const clue = SCOUT_CLUES[idx];
  const answered = state.scoutAnswers[idx];

  const eyebrow = document.createElement("p");
  eyebrow.className = "eyebrow"; eyebrow.textContent = `Scout the Terrain \u00b7 Clue ${idx+1} of ${SCOUT_CLUES.length}`;
  const h2 = document.createElement("h2");
  h2.className = "stage-title"; h2.textContent = clue.tag;
  wrap.appendChild(eyebrow); wrap.appendChild(h2);

  wrap.appendChild(speechRow("nutmeg","Nutmeg", `Sniff around this part of the essay and see what it tells you about Carroll's audience.`));

  const block = document.createElement("div");
  block.className = "clue-block";
  block.innerHTML = `
    <div class="clue-quote">${clue.quote}</div>
    <p class="clue-q">${clue.question}</p>
    <div class="options" id="optList"></div>
    <div class="feedback" id="fb"></div>
  `;
  wrap.appendChild(block);

  const optList = block.querySelector("#optList");
  clue.options.forEach((opt, oi)=>{
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<span class="dot"></span><span>${opt.text}</span>`;
    if(answered){
      if(opt.correct) div.classList.add("correct");
      else if(answered.choice===oi) div.classList.add("incorrect");
      if(answered.choice===oi) div.querySelector(".dot").textContent = "\u2713";
    } else {
      div.onclick = () => {
        state.scoutAnswers[idx] = {choice:oi, correct:opt.correct};
        saveState();
        render();
      };
    }
    optList.appendChild(div);
  });

  if(answered){
    const fb = block.querySelector("#fb");
    fb.classList.add("show", answered.correct ? "good":"bad");
    fb.textContent = answered.correct ? clue.goodFeedback : clue.badFeedback;
  }

  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";
  const backBtn = document.createElement("button");
  backBtn.className = "btn btn-ghost";
  backBtn.textContent = "\u2190 Back";
  backBtn.onclick = () => {
    if(idx===0){ state.stage=0; } else { state.scoutIndex--; }
    saveState(); render();
  };
  const nextBtn = document.createElement("button");
  nextBtn.className = "btn btn-primary";
  const isLast = idx === SCOUT_CLUES.length-1;
  nextBtn.textContent = isLast ? "Finish this checkpoint \u2192" : "Next clue \u2192";
  nextBtn.disabled = !answered;
  nextBtn.onclick = () => {
    if(isLast){ state.stage = 2; } else { state.scoutIndex++; }
    saveState(); render();
  };
  btnRow.appendChild(backBtn); btnRow.appendChild(nextBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

      if(navigator.clipboard && window.isSecureContext !== false){
        await navigator.clipboard.writeText(text);
        copied = true;
      }
    }catch(e){ copied = false; }
    if(!copied){
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus(); ta.select();

        document.body.removeChild(ta);
      }catch(e){ copied = false; }

  };

  rightGroup.appendChild(copyBtn);
  rightGroup.appendChild(resetBtn);
  btnRow.appendChild(backBtn);
  btnRow.appendChild(rightGroup);
  wrap.appendChild(btnRow);

  return wrap;
}

  closeBtn.textContent = "Close";
  closeBtn.style.marginTop = "14px";
  closeBtn.onclick = () => overlay.remove();
  box.appendChild(document.createElement("br"));
  box.appendChild(closeBtn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  ta.focus(); ta.select();
}

function buildReportText(correctCount, result, passage){
  let t = "AUDIENCE TRAIL \u2014 CHILLWATER EXPEDITION REPORT\n";
  t += "Reading: Laura Bolin Carroll, \"Backpacks vs. Briefcases\"\n\n";
  t += `Scout the Terrain: ${correctCount}/${SCOUT_CLUES.length} audience clues identified\n\n`;
  if(result){
    t += `Check Your Footprints: ${result.tier}\n${result.text}\n\n`;
  }
  if(passage){
    t += `Blaze a New Trail \u2014 Original passage: ${passage.title}\n`;
    t += `My rewrite: ${state.rewrite}\n\n`;
    t += `What I changed and why: ${state.rewriteWhy}\n`;
  }
  return t;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}


loadState();
</script>
