
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lloyd's Frozen Tundra — A Rhetorical Situation Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --g1:#9c4fd0; --g2:#5f7ada; --g3:#22c2af;
    --bg:#eef1fb;
    --surface:#fdf8ef;
    --surface-soft:#f4e9d2;
    --line:#e3cf9e;
    --text:#2c2340;
    --text-dim:#746a8c;
    --accent-red:#e9615a;
    --accent-amber:#e0a63e;
    --accent-ok:#1fb3a6;
    --accent-violet:#8a3fbf;
    --shadow:0 20px 44px -22px rgba(50,20,80,.45);
    --header-bg:rgba(20,10,42,.55);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --g1:#2c1b4a; --g2:#1e2c52; --g3:#0d3d3a;
      --bg:#171326;
      --surface:#241d38;
      --surface-soft:#2f2648;
      --line:#4a3d63;
      --text:#f3ecd9;
      --text-dim:#b5a8c9;
      --accent-red:#ff8f6b;
      --accent-amber:#f0c169;
      --accent-ok:#4fe0cf;
      --accent-violet:#c07de8;
      --shadow:0 20px 50px -20px rgba(0,0,0,.6);
      --header-bg:rgba(10,6,20,.6);
    }
  }
  :root[data-theme="dark"]{
    --g1:#2c1b4a; --g2:#1e2c52; --g3:#0d3d3a;
    --bg:#171326;
    --surface:#241d38;
    --surface-soft:#2f2648;
    --line:#4a3d63;
    --text:#f3ecd9;
    --text-dim:#b5a8c9;
    --accent-red:#ff8f6b;
    --accent-amber:#f0c169;
    --accent-ok:#4fe0cf;
    --accent-violet:#c07de8;
    --shadow:0 20px 50px -20px rgba(0,0,0,.6);
    --header-bg:rgba(10,6,20,.6);
  }
  :root[data-theme="light"]{
    --g1:#9c4fd0; --g2:#5f7ada; --g3:#22c2af;
    --bg:#eef1fb;
    --surface:#fdf8ef;
    --surface-soft:#f4e9d2;
    --line:#e3cf9e;
    --text:#2c2340;
    --text-dim:#746a8c;
    --accent-red:#e9615a;
    --accent-amber:#e0a63e;
    --accent-ok:#1fb3a6;
    --accent-violet:#8a3fbf;
    --shadow:0 20px 44px -22px rgba(50,20,80,.45);
    --header-bg:rgba(20,10,42,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:linear-gradient(180deg, var(--g1) 0%, var(--g2) 46%, var(--g3) 100%) fixed;
    color:var(--text);
    font-family:'Nunito Sans', -apple-system, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  .display{
    font-family:'Baloo', ui-rounded, sans-serif;
  }
  .mono{
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  }
  .tnum{ font-variant-numeric:tabular-nums; }

  header.masthead{
    position:sticky; top:0; z-index:10;
    background:var(--header-bg);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#fbf3ff;
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, var(--accent-violet), var(--accent-ok)) 1;
    padding:.6rem clamp(1rem,3vw,2rem);
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    flex-wrap:wrap;
  }
  .masthead-left{ display:flex; align-items:center; gap:.6rem; }
  .masthead-title{
    font-family:'Baloo', ui-rounded, sans-serif;
    font-weight:400;
    letter-spacing:.01em;
    font-size:clamp(1rem,2.4vw,1.4rem);
    line-height:1;
  }
  .masthead-sub{
    font-family:'Baloo', sans-serif;
    font-weight:400;
    font-size:.75rem;
    letter-spacing:.04em;
    color:#e7dbf0;
    text-transform:uppercase;
    margin-top:.2rem;
  }
  .masthead-right{ display:flex; align-items:center; gap:1.1rem; }
  .ticker{ display:flex; gap:.35rem; align-items:center; }
  .ticker .dot{
    width:.6rem; height:.6rem; border-radius:50%;
    background:rgba(255,255,255,.25);
  }
  .ticker .dot.done{ background:var(--accent-ok); }
  .ticker .dot.active{ background:var(--accent-amber); }
  .score-box{
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    font-size:.9rem; letter-spacing:.04em;
    border:1px solid rgba(255,255,255,.3); padding:.3rem .6rem; border-radius:10px;
  }
  .score-box b{ color:#fff; }
  .score-label{ color:#cbb8e8; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; display:block; }

  main#stage{
    max-width:760px; margin:0 auto; padding:clamp(1.5rem,4vw,3.2rem) clamp(1rem,4vw,1.5rem) 4rem;
  }

  .llama-mascot{ display:block; flex-shrink:0; }

  .case-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:clamp(1.4rem,4vw,2.4rem);
    position:relative;
    overflow:hidden;
  }
  .case-card::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:90px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent-ok) 16%, transparent), transparent);
    pointer-events:none;
  }
  .case-card > *{ position:relative; }
  .case-card + .case-card{ margin-top:1.2rem; }

  .hero-mascot-row{ display:flex; align-items:center; gap:1.1rem; margin-bottom:1rem; }

  .eyebrow{
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-violet); margin-bottom:.6rem; display:block;
  }
  .headline{
    font-family:'Baloo', ui-rounded, sans-serif;
    font-weight:400; letter-spacing:0;
    font-size:clamp(1.5rem,4.4vw,2.4rem);
    line-height:1.08; margin-bottom:.9rem;
  }
  .lede{ font-size:1.05rem; line-height:1.55; color:var(--text); max-width:62ch; }
  .lede + .lede{ margin-top:.8rem; }
  .dim{ color:var(--text-dim); }

  .character-hero{
    background:var(--accent-violet); border-radius:16px; padding:20px; margin-bottom:1.2rem; color:#fff; overflow:auto;
  }
  .character-hero img{
    height:150px; width:150px; object-fit:cover; border-radius:14px; border:4px solid #fff;
    box-shadow:0 6px 16px rgba(0,0,0,.25); float:left; margin:0 18px 10px 0;
  }
  .character-hero h2{ margin:0 0 4px; font-family:'Baloo', ui-rounded, sans-serif; font-weight:400; font-size:1.4rem; color:#fff; }
  .character-hero .character-tag{
    display:inline-block; margin:4px 0 8px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; font-size:12px; color:#fff;
  }
  .character-hero p{ font-size:14px; margin:6px 0 0; line-height:1.5; color:#fff; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    font-family:'Baloo', ui-rounded, sans-serif;
    font-weight:400; letter-spacing:.01em; font-size:.92rem;
    border:2px solid var(--accent-violet); background:transparent; color:var(--accent-violet);
    padding:.75rem 1.5rem; border-radius:999px; cursor:pointer;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  .btn:hover{ background:var(--accent-violet); color:#fff; }
  .btn:focus-visible{ outline:3px solid var(--accent-amber); outline-offset:2px; }
  .btn.primary{ background:var(--accent-violet); border-color:var(--accent-violet); color:#fff; }
  .btn.primary:hover{ background:var(--accent-ok); border-color:var(--accent-ok); color:#16221f; }
  .btn:disabled{ opacity:.4; cursor:default; pointer-events:none; }
  .btn.thud{ animation:thud .24s ease; }
  @keyframes thud{
    0%{ transform:scale(1) rotate(0); }
    45%{ transform:scale(1.1) rotate(-3deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  @media (prefers-reduced-motion:reduce){
    .btn.thud{ animation:none; }
  }

  .actions{ margin-top:1.4rem; display:flex; gap:.8rem; flex-wrap:wrap; }

  .def-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:1.4rem; }
  @media (max-width:640px){ .def-grid{ grid-template-columns:1fr; } }
  .def-card{
    background:var(--surface-soft); border:1px solid var(--line); border-radius:14px;
    padding:1.1rem 1rem;
  }
  .def-card .tag{
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    font-size:.72rem; letter-spacing:.1em; font-weight:700; color:var(--accent-violet);
    display:block; margin-bottom:.5rem;
  }
  .def-card p{ font-size:.95rem; line-height:1.5; }

  .pool{
    display:flex; flex-wrap:wrap; gap:.6rem; margin:1.2rem 0 1.4rem;
    padding:.9rem; border:2px dashed var(--line); border-radius:14px; min-height:3.4rem;
  }
  .tile{
    font-size:.88rem; line-height:1.4; text-align:left;
    background:var(--surface); border:1.5px solid var(--text); color:var(--text);
    padding:.6rem .8rem; border-radius:12px; cursor:grab; max-width:22rem;
  }
  .tile.selected{ border-color:var(--accent-amber); box-shadow:0 0 0 2px var(--accent-amber) inset; }
  .tile.correct{ border-color:var(--accent-ok); }
  .tile.incorrect{ border-color:var(--accent-red); }
  .tile-note{ font-size:.82rem; color:var(--text-dim); margin-top:.3rem; }

  .bin-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.9rem; }
  @media (max-width:640px){ .bin-grid{ grid-template-columns:1fr; } }
  .bin-grid.matrix{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:420px){ .bin-grid.matrix{ grid-template-columns:1fr; } }
  .bin{
    border:2px solid var(--line); border-radius:14px; padding:.7rem; min-height:8rem;
    background:var(--bg);
  }
  .bin.dragover{ border-color:var(--accent-amber); background:var(--surface-soft); }
  .bin-label{
    font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
    color:var(--text-dim); display:block; margin-bottom:.55rem;
  }
  .bin-tiles{ display:flex; flex-direction:column; gap:.5rem; }

  .rapid-row{ display:flex; gap:.8rem; margin-top:1.3rem; flex-wrap:wrap; }
  .rapid-btn{ flex:1; min-width:11rem; padding:1rem; font-size:.95rem; }
  .rapid-btn.yes{ border-color:var(--accent-ok); color:var(--accent-ok); }
  .rapid-btn.yes:hover{ background:var(--accent-ok); color:#16221f; }
  .rapid-btn.no{ border-color:var(--accent-red); color:var(--accent-red); }
  .rapid-btn.no:hover{ background:var(--accent-red); color:#2b1410; }
  .progress-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }
  .progress-label{ font-family:ui-monospace,monospace; font-size:.7rem; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; }

  .option-list{ display:flex; flex-direction:column; gap:.7rem; margin-top:1.2rem; }
  .option-btn{
    display:flex; gap:.7rem; align-items:flex-start; text-align:left;
    width:100%; padding:.85rem 1rem; border-radius:14px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--text);
    font-size:.98rem; line-height:1.4; cursor:pointer;
  }
  .option-btn:hover{ border-color:var(--accent-violet); }
  .option-btn .letter{
    font-family:ui-monospace,monospace; font-weight:700; color:var(--text-dim); flex-shrink:0;
  }
  .option-btn.correct{ border-color:var(--accent-ok); background:color-mix(in srgb, var(--accent-ok) 14%, var(--surface)); }
  .option-btn.incorrect{ border-color:var(--accent-red); background:color-mix(in srgb, var(--accent-red) 14%, var(--surface)); }
  .option-btn:disabled{ cursor:default; }

  .feedback{ margin-top:1rem; padding:.9rem 1rem; border-radius:14px; border:2px solid var(--line); }
  .feedback.hit{ border-color:var(--accent-ok); }
  .feedback.miss{ border-color:var(--accent-red); }
  .stamp{
    font-family:'Baloo', ui-rounded, sans-serif; font-weight:400; letter-spacing:.01em;
    font-size:1.05rem; display:inline-block; margin-bottom:.35rem;
  }
  .feedback.hit .stamp{ color:var(--accent-ok); }
  .feedback.miss .stamp{ color:var(--accent-red); }
  .feedback.slam{ animation:slam .3s ease; }
  @keyframes slam{
    0%{ transform:scale(1.4) rotate(-5deg); opacity:0; }
    60%{ transform:scale(.97) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }
  @media (prefers-reduced-motion:reduce){ .feedback.slam{ animation:none; } }
  .feedback p{ font-size:.92rem; line-height:1.5; }

  .track{
    position:relative; height:2.6rem; border-radius:999px; overflow:hidden;
    border:2px solid var(--text); margin-top:1.3rem; display:flex;
  }
  .zone{ height:100%; }
  .zone.early{ background:var(--surface-soft); }
  .zone.fit{ background:color-mix(in srgb, var(--accent-ok) 40%, var(--surface)); }
  .zone.late{ background:color-mix(in srgb, var(--accent-red) 26%, var(--surface)); }
  .needle{
    position:absolute; top:0; bottom:0; width:3px; background:var(--text);
    left:0%;
  }
  .needle::after{
    content:""; position:absolute; top:-.4rem; left:50%; transform:translateX(-50%);
    border-left:.4rem solid transparent; border-right:.4rem solid transparent;
    border-top:.5rem solid var(--text);
  }
  .track-labels{ display:flex; justify-content:space-between; font-family:ui-monospace,monospace; font-size:.62rem; letter-spacing:.06em; color:var(--text-dim); text-transform:uppercase; margin-top:.4rem; }

  .glossary{ display:flex; flex-direction:column; gap:.9rem; margin-top:1.2rem; }
  .glossary .term{ font-family:ui-monospace,monospace; font-weight:700; font-size:.82rem; color:var(--accent-violet); letter-spacing:.06em; text-transform:uppercase; }
  .rank-badge{
    display:inline-block; margin:.6rem 0 .2rem;
    font-family:'Baloo', ui-rounded, sans-serif; font-weight:400;
    font-size:clamp(1.3rem,4vw,1.9rem); letter-spacing:0; color:var(--accent-violet);
  }
  footer.cite{
    max-width:760px; margin:0 auto; padding:0 clamp(1rem,4vw,1.5rem) 3rem;
    font-family:ui-monospace,monospace; font-size:.72rem; color:#e6dcf7; text-align:center;
    line-height:1.6;
  }
  a{ color:inherit; }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-left" id="headerMascotSlot">
    <div>
      <div class="masthead-sub">Vol. 1 &mdash; The Exigence Outpost</div>
    </div>
  </div>
  <div class="masthead-right">
    <div class="ticker" id="ticker" aria-hidden="true"></div>
    <div class="score-box"><span class="score-label">Score</span><b class="tnum" id="scoreDisplay">000</b></div>
  </div>
</header>

<main id="stage"></main>


<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var tickerEl = document.getElementById('ticker');
  var scoreDisplay = document.getElementById('scoreDisplay');

  var LLAMA_SRC = 'https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Lloyd.png';
  var LLOYD_STAND_SRC = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Lloyd.png";
  function llamaSVG(size){
    var h = Math.round(size * (553/338));
    return '<img class="llama-mascot" src="'+LLAMA_SRC+'" width="'+size+'" height="'+h+'" alt="Lloyd the Llama" style="width:'+size+'px;height:'+h+'px;" />';
  }
  var BITZER_SRC = 'https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Lloyd%20B.png';
  var LLOYD_STAND_SRC = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Lloyd%20B.png";
  function bitzerPhoto(size){
    return '<img class="llama-mascot" src="'+BITZER_SRC+'" width="'+size+'" height="'+size+'" alt="Lloyd F. Bitzer" style="width:'+size+'px;height:'+size+'px;object-fit:cover;border-radius:10px;" />';
  }

  var STATE = {
    screen:'start',
    score:0,
    r1Done:false, r2Done:false, r3Done:false, r4Done:false, r5Done:false
  };

  var ROUND_ORDER = ['r1','r2','r3','r4','r5'];

  function addScore(n){
    STATE.score += n;
    scoreDisplay.textContent = String(STATE.score).padStart(3,'0');
  }

  function renderTicker(){
    tickerEl.innerHTML = '';
    var currentIdx = ROUND_ORDER.indexOf(STATE.screen);
    ROUND_ORDER.forEach(function(r, i){
      var dot = document.createElement('div');
      var doneFlag = STATE[r+'Done'];
      dot.className = 'dot' + (doneFlag ? ' done' : (i===currentIdx ? ' active' : ''));
      tickerEl.appendChild(dot);
    });
  }

  function go(screen){
    STATE.screen = screen;
    renderTicker();
    RENDERERS[screen]();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function el(html){
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function thudify(btn){
    btn.classList.remove('thud');
    void btn.offsetWidth;
    btn.classList.add('thud');
  }

  function shuffled(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------------------------------------------------------------- DATA */

  var R1 = {
    caseTitle:'Tundra Tale: The Great Snowball Fort Standoff',
    intro:'Word just reached Lloyd: Berry’s igloo crew and the herd are squaring off over Chillwater Village’s best sledding hill, and neither side is backing down. Before he can say a single word, Lloyd needs to get the situation straight.',
    lede:'Six facts just came in from around the village. Sort each one into what it actually is: the urgent problem itself, the critters positioned to act on it, or something already true that shapes whatever Lloyd says next.',
    bins:[
      {id:'EXIGENCE', label:'Exigence — the urgent problem'},
      {id:'AUDIENCE', label:'Audience — who can act'},
      {id:'CONSTRAINT', label:'Constraint — already true, already shaping it'}
    ],
    tiles:[
      {id:'t1', text:'Lloyd’s herd and Berry’s igloo crew both want the same sledding hill, and nobody will share.', bin:'EXIGENCE',
        note:'An imperfection marked by urgency — and the right words might actually settle it.'},
      {id:'t2', text:'The Tundra Games start tomorrow and the two crews still haven’t agreed on hill rules.', bin:'EXIGENCE',
        note:'A second, related exigence: a deadline making the disagreement urgent.'},
      {id:'t3', text:'Berry the Polar Bear and their igloo crew, who can actually agree to a truce.', bin:'AUDIENCE',
        note:'The critters capable of acting on Lloyd’s words — a truce only happens if they say yes.'},
      {id:'t4', text:'Mayor Yeti, who could officially declare the hill shared turf.', bin:'AUDIENCE',
        note:'Another audience able to act — the Mayor has the authority to make a ruling stick.'},
      {id:'t5', text:'Tundra tradition says whoever builds the first snow fort gets first pick of the hill.', bin:'CONSTRAINT',
        note:'A rule already in place before Lloyd says a word — any fair-sounding response has to work around it.'},
      {id:'t6', text:'Everybody still remembers the Great Cocoa Spill from last winter and doesn’t fully trust each other.', bin:'CONSTRAINT',
        note:'Old history shaping the room — exactly the kind of thing Bitzer calls a constraint.'}
    ],
    pointsEach:10,
    shuffle:true,
    outro:'With the facts sorted, Lloyd’s got the situation straight. Now for the next problem: figuring out which of the village’s complaints are even his to fix.'
  };

  var R2_ITEMS = [
    {text:'Walter’s hot cocoa stand just ran out of marshmallows.', ans:true, note:'A cheerful sign — or a quick word to Walter — can fix this right up.'},
    {text:'The sun sets a little earlier every day as winter deepens.', ans:false, note:'Not even Lloyd’s best speech can talk the sun into staying up later.'},
    {text:'Lloyd and Nutmeg had a falling out over a tangled ball of yarn.', ans:true, note:'A heartfelt apology might actually fix this one.'},
    {text:'Lloyd’s sled runner snapped clean in half.', ans:false, note:'That needs a hammer and a spare runner, not a speech.'},
    {text:'Nobody told the new snow owls where the mail drop-off is.', ans:true, note:'A friendly announcement closes that gap fast.'},
    {text:'A silly rumor is going around that Berry ate all the marshmallows themself.', ans:true, note:'The right words, said clearly, can set the record straight.'},
    {text:'It’s snowing harder than the weather llama predicted this morning.', ans:false, note:'The weather does what it wants, no matter how good the forecast speech is.'},
    {text:'The glacier behind the village creaks and shifts a little every single night.', ans:false, note:'Ancient ice does what ancient ice does — no announcement required.'}
  ];

  var R3_CASES = [
    {
      scenario:'It’s opening morning of the Tundra Games. Snow is falling, the whole village showed up, and everyone’s waiting for Lloyd to kick things off.',
      options:[
        'A warm, excited welcome that gets everyone cheering for the games ahead.',
        'A long lecture about proper igloo insulation techniques.',
        'Lloyd quietly practicing scales for an opera he’s not performing.'
      ],
      correct:0,
      note:'The moment called for excitement and a proper kickoff — pick either of the others, and Lloyd would have, as the tundra critics like to say, "missed the mark."'
    },
    {
      scenario:'Nutmeg hasn’t spoken to Lloyd in three days after their yarn-ball disagreement, and she just walked past him at the frozen pond.',
      options:[
        'A sincere, specific apology about the yarn mix-up.',
        'Pretending nothing happened and asking about the weather.',

  /* ---- Generic sort round engine (used by R1 and R5) ---- */
  function renderSortRound(config, nextScreen, flagName, roundLabel){
    stage.innerHTML = '';
    var tileOrder = config.shuffle ? shuffled(config.tiles) : config.tiles;
    var assignments = {};
    tileOrder.forEach(function(t){ assignments[t.id] = 'pool'; });
    var selected = null;
    var checked = false;

    var card = el(
      '<section class="case-card">'+
        '<span class="eyebrow">'+roundLabel+'</span>'+
        '<h2 class="headline">'+config.caseTitle+'</h2>'+
        (config.intro ? '<p class="lede dim">'+config.intro+'</p>' : '')+
        '<p class="lede">'+config.lede+'</p>'+
        '<div class="pool" id="pool"></div>'+
        '<div class="bin-grid'+(config.bins.length>3?' matrix':'')+'" id="binGrid"></div>'+
        '<p class="lede dim" id="outroText" style="margin-top:1.2rem; display:none;"></p>'+
        '<div class="actions">'+
          '<button class="btn primary" id="checkBtn" disabled>Check My Sort</button>'+
          '<button class="btn" id="contBtn" style="display:none;">Continue</button>'+
        '</div>'+
      '</section>'
    );
    stage.appendChild(card);

    var poolEl = card.querySelector('#pool');
    var binGridEl = card.querySelector('#binGrid');
    var outroText = card.querySelector('#outroText');
    var checkBtn = card.querySelector('#checkBtn');
    var contBtn = card.querySelector('#contBtn');

    function makeTileEl(tile){
      var t = document.createElement('div');
      t.className = 'tile';
      t.textContent = tile.text;
      t.setAttribute('draggable','true');
      t.dataset.id = tile.id;
      t.tabIndex = 0;
      t.addEventListener('click', function(){
        if(checked) return;
        selected = (selected === tile.id) ? null : tile.id;
        draw();
      });
      t.addEventListener('dragstart', function(ev){
        ev.dataTransfer.setData('text/plain', tile.id);
      });
      if(selected === tile.id) t.classList.add('selected');
      if(checked){
        t.classList.add(assignments[tile.id] === tile.bin ? 'correct' : 'incorrect');
      }
      return t;
    }

    function makeBinTarget(container, binId){
      container.addEventListener('dragover', function(ev){ ev.preventDefault(); container.classList.add('dragover'); });
      container.addEventListener('dragleave', function(){ container.classList.remove('dragover'); });
      container.addEventListener('drop', function(ev){
        ev.preventDefault();
        container.classList.remove('dragover');
        var id = ev.dataTransfer.getData('text/plain');
        if(id && !checked){ assignments[id] = binId; selected=null; draw(); }
      });
      container.addEventListener('click', function(ev){
        if(checked) return;
        if(ev.target !== container) return;
        if(selected){ assignments[selected] = binId; selected = null; draw(); }
      });
    }

    function draw(){
      poolEl.innerHTML = '';
      tileOrder.filter(function(t){ return assignments[t.id]==='pool'; })
        .forEach(function(t){ poolEl.appendChild(makeTileEl(t)); });

      binGridEl.innerHTML = '';
      config.bins.forEach(function(b){
        var binEl = document.createElement('div');
        binEl.className = 'bin';
        binEl.dataset.bin = b.id;
        var label = document.createElement('span');
        label.className = 'bin-label';
        label.textContent = b.label;
        binEl.appendChild(label);
        var tilesWrap = document.createElement('div');
        tilesWrap.className = 'bin-tiles';
        config.tiles.filter(function(t){ return assignments[t.id]===b.id; }).forEach(function(t){
          tilesWrap.appendChild(makeTileEl(t));
          if(checked){
            var note = document.createElement('p');
            note.className = 'tile-note';
            note.textContent = t.note;
            tilesWrap.appendChild(note);
          }
        });
        binEl.appendChild(tilesWrap);
        makeBinTarget(binEl, b.id);
        binGridEl.appendChild(binEl);
      });

      var allPlaced = config.tiles.every(function(t){ return assignments[t.id] !== 'pool'; });
      checkBtn.disabled = !allPlaced || checked;
    }

    checkBtn.addEventListener('click', function(e){
      checked = true;
      thudify(e.currentTarget);
      var correctCount = config.tiles.filter(function(t){ return assignments[t.id]===t.bin; }).length;
      addScore(correctCount * config.pointsEach);
      STATE[flagName] = true;
      renderTicker();
      draw();
      checkBtn.style.display = 'none';
      contBtn.style.display = 'inline-flex';
      contBtn.textContent = 'Continue — scored ' + (correctCount*config.pointsEach) + '/' + (config.tiles.length*config.pointsEach);
      if(config.outro){
        outroText.textContent = config.outro;
        outroText.style.display = 'block';
      }
    });
    contBtn.addEventListener('click', function(e){
      thudify(e.currentTarget);
      go(nextScreen);
    });

    draw();
  }

  RENDERERS.r4 = function(){
    stage.innerHTML = '';
    var idx = 0, roundScore = 0;
    var rafId = null, startTime = null, resolved = false;
    var DURATION = 6000;

    var card = el(
      '<section class="case-card">'+
        '<span class="eyebrow">Tundra Tale 4 · Don’t Miss the Moment</span>'+
        '<h2 class="headline">Help Lloyd time it right</h2>'+
        '<p class="lede dim">Read the moment, then hit “Let’s Go” when you’re ready. Watch the needle sweep the track and click the button while it’s in the green “fitting moment” zone — too soon or too late and Lloyd misses it.</p>'+
        '<div class="progress-row"><span class="progress-label" id="progLabel4"></span><span class="progress-label tnum" id="progScore4"></span></div>'+
        '<p class="lede" id="flavorText"></p>'+
        '<div class="track" id="track"><div class="needle" id="needle"></div></div>'+
        '<div class="track-labels"><span>Too soon</span><span>Fitting moment</span><span>Too late</span></div>'+
        '<div class="actions"><button class="btn primary" id="actionBtn"></button></div>'+
        '<div id="fbSlot4"></div>'+
        '<div class="actions"><button class="btn" id="nextBtn4" style="display:none;">Next</button><button class="btn" id="contBtn4" style="display:none;">Continue</button></div>'+
      '</section>'
    );
    stage.appendChild(card);
    var progLabel4 = card.querySelector('#progLabel4');
    var progScore4 = card.querySelector('#progScore4');
    var flavorText = card.querySelector('#flavorText');
    var track = card.querySelector('#track');
    var needle = card.querySelector('#needle');
    var actionBtn = card.querySelector('#actionBtn');
    var fbSlot4 = card.querySelector('#fbSlot4');
    var nextBtn4 = card.querySelector('#nextBtn4');
    var contBtn4 = card.querySelector('#contBtn4');

    function buildTrack(c){
      track.querySelectorAll('.zone').forEach(function(z){ z.remove(); });
      var earlyPct = c.early*100, latePct = c.late*100;
      var zEarly = document.createElement('div');
      zEarly.className = 'zone early'; zEarly.style.width = earlyPct+'%';
      var zFit = document.createElement('div');
      zFit.className = 'zone fit'; zFit.style.width = (latePct-earlyPct)+'%';
      var zLate = document.createElement('div');
      zLate.className = 'zone late'; zLate.style.width = (100-latePct)+'%';
      track.insertBefore(zEarly, needle);
      track.insertBefore(zFit, needle);
      track.insertBefore(zLate, needle);
    }

    function resolve(elapsedFrac, c){
      if(resolved) return;
      resolved = true;
      cancelAnimationFrame(rafId);
      actionBtn.disabled = true;
      var right = elapsedFrac >= c.early && elapsedFrac <= c.late;
      var note = right ? c.hit_note : (elapsedFrac < c.early ? c.early_note : c.late_note);
      if(right){ roundScore += 20; addScore(20); }
      var fb = document.createElement('div');
      fb.className = 'feedback slam ' + (right ? 'hit' : 'miss');
      fb.innerHTML = '<span class="stamp">'+(right ? 'Spot On, Lloyd!' : 'Oof, Missed It')+'</span><p>'+note+'</p>';
      fbSlot4.appendChild(fb);
      progScore4.textContent = 'Round score: ' + roundScore;
      nextBtn4.style.display = 'inline-flex';
    }

    function drawCase(){
      resolved = false;
      var c = R4_CASES[idx];
      progLabel4.textContent = 'Timing ' + (idx+1) + ' of ' + R4_CASES.length;
      progScore4.textContent = 'Round score: ' + roundScore;
      flavorText.textContent = c.flavor;
      fbSlot4.innerHTML = '';
      nextBtn4.style.display = 'none';
      buildTrack(c);
      needle.style.left = '0%';
      needle.style.visibility = 'hidden';
      actionBtn.disabled = false;
      actionBtn.textContent = 'Let’s Go';

      function tick(now){
        var elapsed = now - startTime;
        var frac = Math.min(elapsed / DURATION, 1);
        needle.style.left = (frac*100) + '%';
        if(frac >= 1){
          resolve(1, c);
          return;
        }
        if(!resolved) rafId = requestAnimationFrame(tick);
      }

      actionBtn.onclick = function(e){
        thudify(e.currentTarget);
        needle.style.visibility = 'visible';
        actionBtn.textContent = c.command;
        startTime = performance.now();
        rafId = requestAnimationFrame(tick);
        actionBtn.onclick = function(e2){
          thudify(e2.currentTarget);
          var now = performance.now();
          var frac = Math.min((now - startTime) / DURATION, 1);
          resolve(frac, c);
        };
      };
    }

    nextBtn4.addEventListener('click', function(e){
      thudify(e.currentTarget);
      idx++;
      if(idx >= R4_CASES.length){
        STATE.r4Done = true;
        renderTicker();
        cancelAnimationFrame(rafId);
        flavorText.textContent = 'Lloyd’s timing is sharp. One more skill before he calls it a day.';
        track.querySelectorAll('.zone').forEach(function(z){ z.remove(); });
        needle.style.left='0%';
        track.style.display = 'none';
        card.querySelector('.track-labels').style.display = 'none';
        actionBtn.style.display = 'none';
        fbSlot4.innerHTML = '';
        nextBtn4.style.display = 'none';
        progLabel4.textContent = 'Timing round complete';
        progScore4.textContent = 'Round score: ' + roundScore + ' / ' + (R4_CASES.length*20);
        contBtn4.style.display = 'inline-flex';
      } else {
        drawCase();
      }
    });
    contBtn4.addEventListener('click', function(e){
      thudify(e.currentTarget);
      go('r5');
    });

    drawCase();
  };

  /* ---- Debrief ---- */
  RENDERERS.debrief = function(){
    stage.innerHTML = '';
    var max = R1.tiles.length*R1.pointsEach + R2_ITEMS.length*10 + R3_CASES.length*20 + R4_CASES.length*20 + R5.tiles.length*R5.pointsEach;
    var pct = STATE.score / max;
    var rank = pct >= 0.87 ? 'Lloyd’s Right-Hand Llama'
      : pct >= 0.65 ? 'Tundra Town Crier'
      : pct >= 0.4 ? 'Junior Herd Hand'
      : 'Snowball Apprentice';

    var glossHtml = GLOSSARY.map(function(g){
      return '<div><span class="term">'+g.term+'</span><p>'+g.def+'</p></div>';
    }).join('');

    var card = el(
      '<section class="case-card">'+
        '<div class="hero-mascot-row">'+llamaSVG(60)+
          '<div><span class="eyebrow" style="margin-bottom:.2rem;">Trail’s End</span>'+
          '<h2 class="headline" style="margin-bottom:0;">Trek complete!</h2></div>'+
        '</div>'+
        '<p class="lede">Final score: <strong class="tnum">'+STATE.score+'</strong> / '+max+'</p>'+
        '<div class="rank-badge">'+rank+'</div>'+
        '<p class="lede dim">'+ (pct>=0.65 ? 'You read the tundra the way Lloyd always hoped someone would — sizing up the whole situation before opening your mouth. That’s exactly what Lloyd Bitzer said a good rhetor should do.' : 'The tundra’s full of second chances — trek back through and give the situations another read.') +'</p>'+
        '<h3 style="margin-top:1.6rem; font-family:ui-monospace,monospace; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);">Glossary Recap</h3>'+
        '<div class="glossary">'+glossHtml+'</div>'+
        '<div class="actions"><button class="btn primary" id="againBtn">Trek Again</button></div>'+
      '</section>'
    );
    stage.appendChild(card);
    card.querySelector('#againBtn').addEventListener('click', function(e){
      thudify(e.currentTarget);
      STATE.score = 0;
      STATE.r1Done = STATE.r2Done = STATE.r3Done = STATE.r4Done = STATE.r5Done = false;
      scoreDisplay.textContent = '000';
      go('start');
    });
  };

  /* boot */
  renderTicker();
  RENDERERS.start();
})();
</script>
</body>
</html>
