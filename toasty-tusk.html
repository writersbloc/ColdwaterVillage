
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vol. 4 — The Redesign Stand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --aurora:#9c4fd0; --twilight:#5f7ada; --tundra:#22c2af;
    --lloydc:#8a3fbf; --fit:#1fb3a6; --miss:#e9615a; --amber:#e0a63e;
    --cream:#fdf8ef; --plum:#241d38;
    --berry: var(--twilight); --nutmeg: var(--amber); --yeti: var(--tundra);
    --walter:#c9705f;
    --font-display:'Baloo', system-ui, sans-serif;
    --font-body:'Nunito Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  img{-webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none;}
  body{
    margin:0; min-height:100vh; overscroll-behavior-y: contain; font-family:var(--font-body); color:var(--plum);
    background:linear-gradient(180deg, var(--aurora) 0%, var(--twilight) 45%, var(--tundra) 100%);
    padding:0 0 120px;
  }
  #app{max-width:880px; margin:0 auto; padding:20px 14px 0; box-sizing:border-box;}
  h1,h2,h3{font-family:var(--font-display); font-weight:400; margin:0 0 6px;}
  p{line-height:1.5;}
  .card{background:var(--cream); border-radius:4px; padding:22px; box-shadow:0 12px 30px rgba(20,10,40,.25);}
  .btn{
    font-family:var(--font-display); font-weight:400; font-size:15px; border:none; border-radius:3px;
    padding:12px 22px; cursor:pointer; color:#fff; background:var(--lloydc);
    box-shadow:0 4px 0 rgba(0,0,0,.15); transition:transform .1s;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .btn:disabled{background:#bbb; cursor:not-allowed; box-shadow:none;}
  .btn.ghost{background:transparent; color:var(--plum); box-shadow:none; border:2px solid var(--plum);}
  .center{text-align:center;}

  /* header */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(36,29,56,.7);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, var(--lloydc), var(--fit)) 1;
    padding:10px clamp(14px,4vw,2rem);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin:0 0 16px;
  }
  .village-title{color:#fff; font-family:var(--font-display); font-size:clamp(1rem,2.4vw,1.4rem); text-shadow:0 2px 6px rgba(0,0,0,.25);}
  .village-title small{display:block; font-family:var(--font-display); font-weight:400; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:#e7dbf0; opacity:1;}
  .badge-row{display:flex; gap:8px;}
  .badge-row .badge-icon{opacity:1;}
  .round-dots{display:flex; gap:6px; align-items:center; margin:10px 0 18px;}
  .round-dots .dot{width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.35);}
  .round-dots .dot.done{background:var(--fit);}
  .round-dots .dot.current{background:#fff;}

  /* badge icon */
  .badge-icon{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--cream); border:3px solid currentColor;
    box-shadow:0 0 0 3px var(--cream), 0 0 0 5px currentColor;
    opacity:.35; transition:opacity .3s, transform .3s;
  }
  .badge-icon.earned{opacity:1; transform:scale(1.05);}
  .badge-icon svg{width:20px; height:20px; fill:currentColor;}
  .badge-icon.contrast{color:var(--berry);}
  .badge-icon.proximity{color:var(--nutmeg);}
  .badge-icon.repetition{color:var(--yeti);}
  .badge-icon.alignment{color:var(--lloydc);}
  .badge-icon.walter{color:var(--walter);}

  /* stage */
  .stage-wrap{position:relative;}
  .stage{
    position:relative; width:100%; aspect-ratio:16/10; background:#fff;
    border-radius:4px; border:2px solid #e7dfce; overflow:hidden; margin:14px 0;
  }
  .stage .grid-guide{
    position:absolute; left:50%; top:4%; bottom:4%; width:0; border-left:2px dashed transparent;
    transform:translateX(-50%); transition:border-color .5s;
  }
  .stage.aligned .grid-guide{border-color:var(--fit);}
  .el{position:absolute; white-space:nowrap;}
  .el{transition:opacity .25s, filter .25s;}
  .stage.spotlight-active .el{opacity:.55; filter:none;}
  .stage.spotlight-active .el.spot-hit{opacity:1;}
  .el.spot-hit{outline:3px solid var(--amber); outline-offset:5px; border-radius:4px; background:rgba(224,166,60,.18); z-index:5;}

  /* image-based hotspot zones */
  .messy-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .pin-zone{
    position:absolute; border:2px dashed transparent; border-radius:4px; cursor:pointer;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .pin-zone::after{
    content:attr(data-num); position:absolute; top:-14px; left:-14px; width:28px; height:28px; border-radius:50%;
    background:var(--miss); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center;
    font-size:13px; box-shadow:0 3px 8px rgba(0,0,0,.25); animation:pulse 1.8s infinite;
  }
  .pin-zone.solved::after{background:var(--fit); content:'✓'; animation:none;}
  .pin-zone.solved{border-color:var(--fit); border-style:solid;}
  .pin-zone.spot-cutout{border-color:var(--amber); border-style:solid; background:rgba(224,166,60,.22); box-shadow:0 0 0 4px rgba(224,166,60,.3); z-index:10;}
  .pin-zone .pin-label{left:50%; top:auto; bottom:-6px; transform:translate(-50%,100%);}

  /* quiz */
  .quiz-block{background:#fff; border-radius:4px; padding:16px; margin-bottom:14px; box-shadow:0 3px 8px rgba(0,0,0,.1);}
  .quiz-block .qhead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .quiz-block .qhead p{margin:0; font-weight:700; font-size:14px;}
  .quiz-opt{
    display:block; width:100%; text-align:left; background:var(--cream); border:2px solid #e7dfce; border-radius:4px;
    padding:10px 12px; margin-bottom:8px; font-family:var(--font-body); font-size:13.5px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .quiz-opt:hover{border-color:var(--lloydc);}
  .quiz-opt.correct{border-color:var(--fit); background:rgba(31,179,166,.12); font-weight:700;}
  .quiz-opt.wrong{border-color:var(--miss); background:rgba(232,97,90,.12);}
  .quiz-opt.disabled{cursor:default;}

  /* diagnose pins */
  .pin{
    position:absolute; width:34px; height:34px; border-radius:50%; background:var(--miss);
    border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.25); cursor:default;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.25), 0 0 0 0 rgba(233,97,90,.5);}50%{box-shadow:0 3px 8px rgba(0,0,0,.25), 0 0 0 8px rgba(233,97,90,0);}}
  .pin.solved{background:var(--fit); animation:none; cursor:default;}
  .pin{cursor:pointer;}
  .pin-label{
    position:absolute; font-size:11px; font-weight:700; color:#fff; background:var(--plum);
    padding:3px 8px; border-radius:4px; white-space:nowrap; transform:translate(-50%,6px); left:50%; top:100%;
    opacity:0; pointer-events:none; transition:opacity .15s; z-index:20;
  }
  .pin:hover .pin-label, .pin:focus .pin-label, .pin.show-label .pin-label{opacity:1;}
  .pin-zone:hover .pin-label, .pin-zone:focus .pin-label, .pin-zone.show-label .pin-label{opacity:1;}

  /* advisor click-to-consult tray */
  .advisor-click{
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; position:relative;
    padding:8px 6px; border-radius:4px; transition:background .15s, transform .15s;
  }
  .advisor-click:hover{background:rgba(255,255,255,.55); transform:translateY(-2px);}
  .advisor-click .advisor-name{font-size:11px; font-weight:700; color:var(--plum);}
  .advisor-click.active .badge-icon{box-shadow:0 0 0 3px var(--cream), 0 0 0 5px var(--amber); transform:scale(1.08);}
  .advisor-click .check-badge{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--fit);
    color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.5); transition:opacity .2s, transform .2s; box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .advisor-click.consulted .check-badge{opacity:1; transform:scale(1);}
  .advice-card.current{box-shadow:0 0 0 3px var(--amber);}

  /* capstone */
  .capstone-bins{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:16px 0;}
  @media (max-width:480px){.capstone-bins{grid-template-columns:1fr;}}
  .capstone-bin{
    background:#fff; border-radius:4px; padding:10px 12px; box-shadow:0 3px 8px rgba(0,0,0,.1);
    display:flex; align-items:center; gap:10px; border:2px dashed #e7dfce; transition:border-color .2s, background .2s;
  }
  .capstone-bins .capstone-bin{position:static; font-size:inherit; color:inherit; text-align:left;}
  .capstone-bin.filled-all{border-color:var(--fit); border-style:solid; background:rgba(31,179,166,.06);}
  .capstone-bin .bin-label{min-width:0; flex-shrink:0;}
  .capstone-bin .name{font-family:var(--font-display); font-weight:400; font-size:13.5px;}
  .capstone-bin .bin-count{font-size:10.5px; color:#5a5040; font-weight:700;}
  .bin-checks{margin-left:auto; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px;}
  .filed-card{
    width:28px; height:22px; border-radius:4px; background:var(--card-color, var(--fit)); flex-shrink:0;
    box-shadow:0 2px 4px rgba(0,0,0,.2); animation:fileIn .3s ease;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:800;
  }
  @keyframes fileIn{from{opacity:0; transform:translateY(-10px) scale(.7);}to{opacity:1; transform:translateY(0) scale(1);}}
  #capstone-tray{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; background:rgba(255,255,255,.5); border-radius:4px; padding:14px;}
  .capstone-chip{width:100%; max-width:none; white-space:normal; font-size:12px; line-height:1.35; text-align:left; align-items:flex-start; padding:8px 10px; box-sizing:border-box;}

  /* cup critique */
  .critique-boxes{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:16px 0;}
  @media (max-width:520px){.critique-boxes{grid-template-columns:1fr;}}
  .critique-box{background:#fff; border-radius:4px; padding:12px; border:2px solid; box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .critique-box .qhead{display:flex; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .critique-box .qhead p{margin:0; font-size:13px; font-weight:600; line-height:1.35;}
  .critique-input{
    width:100%; min-height:90px; border-radius:4px; border:2px solid #e7dfce; padding:8px; font-family:var(--font-body);
    font-size:13px; resize:vertical; box-sizing:border-box;
  }

  /* tray */
  .tray{display:flex; flex-wrap:wrap; gap:12px; padding:14px; background:rgba(255,255,255,.5); border-radius:4px; min-height:70px; align-items:center;}
  .piece{
    background:#fff; border-radius:4px; padding:8px 14px; font-weight:700; font-size:13px;
    box-shadow:0 3px 8px rgba(0,0,0,.15); cursor:grab; border:2px solid transparent; user-select:none;
    display:flex; align-items:center; gap:6px;
  }
  .piece.dragging{cursor:grabbing; box-shadow:0 10px 20px rgba(0,0,0,.3);}
  .piece.placed{cursor:default;}
  .piece.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .advisor-badge{width:56px; height:56px; border-radius:50%;}
  .advisor-badge svg{width:28px; height:28px;}

  /* dropzones in rebuild */
  .dropzone{
    position:absolute; border:2px dashed #c9bfa6; border-radius:4px; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#9c8f70; text-align:center; padding:4px; transition:border-color .2s, background .2s;
  }
  .dropzone.filled{border-style:solid; border-color:var(--fit); background:rgba(31,179,166,.08);}
  .dropzone.preview{border-style:solid; border-color:var(--amber); background:rgba(224,166,60,.12);}
  .dropzone.preview .preview-ghost{opacity:.55;}

  .stage.reveal{animation:revealPulse 1.1s ease;}
  @keyframes revealPulse{
    0%{box-shadow:0 0 0 0 rgba(224,166,60,0); transform:scale(1);}
    30%{box-shadow:0 0 0 10px rgba(224,166,60,.35); transform:scale(1.015);}
    60%{box-shadow:0 0 0 4px rgba(31,179,166,.3); transform:scale(1.005);}
    100%{box-shadow:0 0 0 0 rgba(31,179,166,0); transform:scale(1);}
  }
  .reveal-frame{
    padding:8px; margin:16px 0; border-radius:4px;
    background:linear-gradient(135deg, var(--amber), var(--fit));
  }
  .reveal-frame .stage{margin:0;}
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-top:12px;}
  .gallery-item .stage{margin:0 0 6px;}
  .gallery-hero{margin-top:12px; max-width:360px; margin-left:auto; margin-right:auto;}
  .charter-walt{display:flex; flex-direction:column; align-items:center; margin:14px 0;}
  .charter-walt img{
    width:190px; height:190px; object-fit:cover; border-radius:4px; border:5px solid #fff;
    box-shadow:0 10px 24px rgba(20,10,40,.3);
  }
  .charter-walt-label{text-align:center; font-family:var(--font-display); font-weight:400; font-size:15px; margin:10px 0 0;}
  .charter-walt-label span{display:block; font-family:var(--font-body); font-weight:600; font-size:12px; color:#5a5040; margin-top:2px;}

  .tray-placeholder{visibility:hidden;}

  /* advice log */
  .advice-log{margin-top:14px;}
  .advice-card{
    display:flex; gap:10px; background:#fff; border-radius:4px; padding:12px; margin-bottom:8px;
    border-left:6px solid var(--plum); box-shadow:0 3px 8px rgba(0,0,0,.1); animation:slideIn .3s;
  }
  @keyframes slideIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}
  .advice-card .name{font-family:var(--font-display); font-weight:400; font-size:14px; margin-bottom:2px;}
  .advice-card p{margin:0; font-size:13.5px;}

  .flavor{font-size:14px; color:#5a5040; margin-bottom:6px;}
  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}
  .banner{
    background:var(--fit); color:#fff; padding:10px 16px; border-radius:3px; font-weight:700;
    text-align:center; margin-top:12px; animation:slideIn .4s;
  }
  .crew-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:16px;}
  .crew-grid.two-col{grid-template-columns:repeat(2,1fr);}
  @media (max-width:420px){.crew-grid.two-col{grid-template-columns:1fr;}}
  .crew-card{background:#fff; border-radius:4px; padding:16px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,.1);}
  .crew-card .badge-icon{margin:0 auto 10px; width:56px; height:56px; opacity:1;}
  .crew-card .badge-icon svg{width:28px; height:28px;}
  .crew-card h3{font-size:16px;}
  .crew-card .principle-tag{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 8px; border-radius:10px; margin:4px 0 8px; color:#fff;
  }
  .crew-card p{font-size:13px; color:#5a5040;}
  .walter-hero{
    background:var(--miss); border-radius:4px; padding:20px; margin-bottom:1.2rem; color:#fff; overflow:auto;
  }
  .walter-hero img{
    height:150px; width:150px; object-fit:cover; border-radius:4px; border:4px solid #fff;
    box-shadow:0 6px 16px rgba(0,0,0,.25); float:left; margin:0 18px 10px 0;
  }
  .walter-hero h2{margin:0 0 4px; font-size:1.4rem;}
  .walter-hero .principle-tag{background:none; color:#fff; font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:12px; display:inline-block; margin:4px 0 8px;}
  .walter-hero p{font-size:14px; margin:6px 0 0; line-height:1.5;}
  .crew-heading{color:var(--plum); margin:4px 0 2px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; opacity:.7;}
  textarea{
    width:100%; min-height:90px; border-radius:4px; border:2px solid #e7dfce; padding:10px; font-family:var(--font-body);
    font-size:14px; resize:vertical;
  }
  .charter{border:3px double var(--aurora); padding:18px;}

  .advisor-popup-overlay{
    position:fixed; inset:0; background:rgba(20,10,40,.5); display:flex; align-items:center; justify-content:center;
    z-index:2000; padding:20px; animation:slideIn .15s;
  }
  .advisor-popup{
    background:var(--cream); border-radius:5px; padding:24px 22px 20px; max-width:300px; text-align:center;
    box-shadow:0 16px 36px rgba(0,0,0,.35); position:relative;
  }
  .advisor-popup .close-btn{
    position:absolute; top:8px; right:10px; background:none; border:none; font-size:18px; cursor:pointer;
    color:var(--plum); font-family:var(--font-body); line-height:1; padding:4px;
  }
  .advisor-popup .badge-icon{margin:0 auto 10px;}
  .advisor-popup h3{font-size:17px;}
  .advisor-popup .principle-tag{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 10px; border-radius:10px; margin:4px 0 10px; color:#fff;
  }
  .advisor-popup p{font-size:14px; margin:0;}
  .advisor-badge{cursor:pointer;}

  /* mobile pass */
  .btn{min-height:44px;}
  .badge-row{flex-wrap:wrap;}
  @media (max-width:480px){
    body{padding:14px 10px 100px;}
    .card{padding:16px;}
    .village-title{font-size:19px;}
    h1{font-size:20px;}
    h2{font-size:18px;}
    h3{font-size:15px;}
    .btn{width:100%; padding:13px 18px; font-size:14.5px;}
    .nav-row{flex-direction:column; align-items:stretch;}
    .nav-row > div:first-child:empty{display:none;}
    .quiz-opt{padding:12px 12px; font-size:13px;}
    .advisor-badge{width:52px; height:52px;}
    .badge-icon{width:34px; height:34px;}
    .crew-card, .capstone-bin, .critique-box, .quiz-block, .advice-card{padding:10px;}
    textarea, .critique-input{font-size:16px;}
  }
</style>
</head>
<body>
<header id="topbarMount"></header>
<div id="app"></div>

<script>
/* ---------- Principle / character data ---------- */
const WALTER_HERO = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Walter.png";
const WALTER_SMALL = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Walter.png";

const SIGN_MESSY_IMG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Sign%201.png";
const SIGN_AFTER_IMG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Sign%202.png";

const MENU_MESSY_IMG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Menu%201.png";
const MENU_AFTER_IMG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Menu%202.png";

const CUP_IMG = "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Cup.png";

const PRINCIPLE_IMAGES = {
  repetition: "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Mayor.png",
  contrast: "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Berry.png",
  alignment: "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Lloyd.png",
  proximity: "https://raw.githubusercontent.com/writersbloc/ColdwaterVillage/main/Toasty%20Tusk/Nutmeg.png",
};

const ICONS = {
  contrast: `<svg viewBox="0 0 48 48"><circle cx="14" cy="12" r="6"/><circle cx="34" cy="12" r="6"/><circle cx="24" cy="27" r="16"/></svg>`,
  proximity: `<svg viewBox="0 0 48 48"><polygon points="10,18 18,2 22,18"/><polygon points="38,18 30,2 26,18"/><circle cx="24" cy="27" r="14"/><polygon points="24,33 16,43 32,43"/></svg>`,

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function applySpotlight(stage, r, principle){
  if(r.messyImage){
    stage.querySelectorAll('.pin-zone').forEach(z=>{
      const on = !!principle && z.dataset.principle===principle;
      z.classList.toggle('spot-cutout', on);
      z.classList.toggle('show-label', on);
    });
  } else {
    stage.classList.toggle('spotlight-active', !!principle);
    stage.querySelectorAll('.el').forEach(el=>{
      const tags = (el.dataset.problem||'').split(' ');
      el.classList.toggle('spot-hit', !!principle && tags.includes(principle));
    });
    stage.querySelectorAll('.pin').forEach(p=>{
      p.classList.toggle('show-label', !!principle && p.dataset.principle===principle);
    });
  }
}

function showAdvisorPopup(principle){
  const P = PRINCIPLES[principle];
  const overlay = document.createElement('div');
  overlay.className = 'advisor-popup-overlay';
  overlay.innerHTML = `
    <div class="advisor-popup">
      <button class="close-btn" aria-label="Close">✕</button>
      ${badgeIcon(principle, true, 76)}
      <h3>${P.advisor}</h3>
      <span class="principle-tag" style="background:${P.color}">${P.name}</span>
      <p>"${P.line}"</p>
    </div>`;
  overlay.addEventListener('click', (e)=>{
    if(e.target===overlay || e.target.closest('.close-btn')) overlay.remove();
  });
  document.body.appendChild(overlay);
}

function badgeIcon(principle, earned, size){
  const img = principle==='walter' ? WALTER_SMALL : PRINCIPLE_IMAGES[principle];
  const inner = img ? `<img src="${img}" alt="${principle}" draggable="false" ondragstart="return false;" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : ICONS[principle];
  return `<div class="badge-icon ${principle} ${earned?'earned':''}" style="${size?`width:${size}px;height:${size}px;`:''} overflow:hidden;">${inner}</div>`;
}

function topbarBar(){
  return `
  <div class="topbar">
    <div class="village-title">
      <small>Vol. 4 &mdash; The Redesign Stand</small>
    </div>
    <div class="badge-row">${ORDER.map(p=>badgeIcon(p, state.badgesEarned.has(p))).join('')}</div>
  </div>
  `;
}

function roundDotsHTML(){
  return state.screen!=='intro' && state.screen!=='certificate' && state.screen!=='capstone' ? `<div class="round-dots">${ROUNDS.map((rr,i)=>`<div class="dot ${i<state.roundsCompleted?'done':''} ${i===state.round?'current':''}"></div>`).join('')}</div>` : '';
}

let _lastScreen = null;
function render(){
  // Safety net: clean up any stray draggable pieces left attached directly
  // to <body> (e.g. from an interrupted drag), so ghost duplicates can't
  // accumulate or intercept input.
  document.querySelectorAll('body > .piece').forEach(el=>el.remove());
  document.getElementById('topbarMount').innerHTML = topbarBar();
  const app = document.getElementById('app');
  if(state.screen==='intro') app.innerHTML = roundDotsHTML() + renderIntro();
  else if(state.screen==='diagnose') app.innerHTML = roundDotsHTML() + renderDiagnose();
  else if(state.screen==='critique') app.innerHTML = roundDotsHTML() + renderCritique();
  else if(state.screen==='rebuild') app.innerHTML = roundDotsHTML() + renderRebuild();
  else if(state.screen==='reveal') app.innerHTML = roundDotsHTML() + renderReveal();
  else if(state.screen==='certificate') app.innerHTML = roundDotsHTML() + renderCertificate();
  else if(state.screen==='capstone') app.innerHTML = roundDotsHTML() + renderCapstone();
  const pageKey = state.screen+':'+state.round;
  if(pageKey!==_lastScreen){
    window.scrollTo(0,0);
    _lastScreen = pageKey;
  }
  wireUp();
}

/* ---------- Drag engine ---------- */
function enableDrag(piece, onCorrect, opts){
  opts = opts || {};
  piece.style.touchAction='none';
  piece.addEventListener('pointerdown', function(e){
    if(piece.classList.contains('placed')) return;
    e.preventDefault();
    const startX=e.clientX, startY=e.clientY;
    const tapThreshold = e.pointerType==='touch' ? 18 : 6;
    const rect = piece.getBoundingClientRect();
    const dx = startX-rect.left, dy = startY-rect.top;
    const parent = piece.parentNode, next = piece.nextSibling;
    const ph = document.createElement('div');
    ph.className='tray-placeholder';
    ph.style.width=rect.width+'px'; ph.style.height=rect.height+'px';
    parent.insertBefore(ph, piece);
    document.body.appendChild(piece);
    piece.style.position='fixed'; piece.style.left=rect.left+'px'; piece.style.top=rect.top+'px';
    piece.style.width=rect.width+'px'; piece.style.zIndex=999;
    piece.style.pointerEvents='none';
    piece.classList.add('dragging');
    try{ piece.setPointerCapture(e.pointerId); }catch(err){}

    let maxDist = 0;
    let hoverZone = null;
    let scrollRAF = null, scrollSpeed = 0, lastClientY = startY;
    function clearHover(){
      if(hoverZone){
        hoverZone.classList.remove('preview');
        if(hoverZone.dataset.origHtml!==undefined){
          hoverZone.innerHTML = hoverZone.dataset.origHtml;
        }
        hoverZone = null;
      }
    }
    function updateAutoScroll(clientY){
      const edge = 70, vh = window.innerHeight;
      if(clientY < edge){
        scrollSpeed = -Math.round((edge - clientY) * 0.6);
      } else if(clientY > vh - edge){
        scrollSpeed = Math.round((clientY - (vh - edge)) * 0.6);
      } else {
        scrollSpeed = 0;
      }
      if(scrollSpeed !== 0 && !scrollRAF){
        (function step(){
          window.scrollBy(0, scrollSpeed);
          piece.style.top = (lastClientY-dy)+'px';
          scrollRAF = requestAnimationFrame(step);
        })();
      } else if(scrollSpeed === 0 && scrollRAF){
        cancelAnimationFrame(scrollRAF);
        scrollRAF = null;
      }
    }
    function move(ev){
      const d = Math.hypot(ev.clientX-startX, ev.clientY-startY);
      if(d>maxDist) maxDist=d;
      lastClientY = ev.clientY;
      piece.style.left=(ev.clientX-dx)+'px';
      piece.style.top=(ev.clientY-dy)+'px';
      updateAutoScroll(ev.clientY);
      if(opts.preview){
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const zone = el ? el.closest('.dropzone') : null;
        const validZone = zone && zone.dataset.principle===piece.dataset.principle && !zone.classList.contains('filled');
        if(validZone && zone!==hoverZone){
          clearHover();
          hoverZone = zone;
          if(hoverZone.dataset.origHtml===undefined) hoverZone.dataset.origHtml = hoverZone.innerHTML;
          hoverZone.classList.add('preview');
          hoverZone.innerHTML = `<div class="preview-ghost" style="${piece.getAttribute('style')||''}">${piece.innerHTML}</div>`;
        } else if(!validZone && hoverZone){
          clearHover();
        }
      }
    }
    function reset(){
      piece.removeEventListener('pointermove',move);
      piece.removeEventListener('pointerup',up);
      piece.classList.remove('dragging');
      clearHover();
      if(scrollRAF){ cancelAnimationFrame(scrollRAF); scrollRAF = null; }
      piece.style.pointerEvents='';
      piece.style.position=''; piece.style.left=''; piece.style.top=''; piece.style.width=''; piece.style.zIndex='';
    }
    function cancel(){
      if(!piece.classList.contains('dragging')) return;
      reset();
      parent.insertBefore(piece, next && next.parentNode ? next : null);
      ph.remove();
    }
    function up(ev){
      const el=document.elementFromPoint(ev.clientX, ev.clientY);
      reset();

      const finalDist = Math.max(maxDist, Math.hypot(ev.clientX-startX, ev.clientY-startY));
      if(finalDist<tapThreshold){
        parent.insertBefore(piece, next && next.parentNode ? next : null);
        ph.remove();
        if(opts.onTap) opts.onTap(piece);
        return;
      }
      let zone = el ? el.closest('.dropzone, .pin, .pin-zone') : null;
      let match = zone && zone.dataset.principle===piece.dataset.principle && !zone.classList.contains('filled') && !zone.classList.contains('solved');
      if(!match){
        const candidates = document.querySelectorAll('.dropzone[data-principle="'+piece.dataset.principle+'"], .pin[data-principle="'+piece.dataset.principle+'"], .pin-zone[data-principle="'+piece.dataset.principle+'"]');
        const open = [...candidates].find(c=>!c.classList.contains('filled') && !c.classList.contains('solved'));
        if(open){
          if(typeof opts.snapBuffer==='number'){
            // Positional puzzle (e.g. diagnose matching): only forgive a near-miss,
            // require actually being close to the right spot.
            const r = open.getBoundingClientRect();
            const dx = Math.max(r.left-ev.clientX, 0, ev.clientX-r.right);
            const dy = Math.max(r.top-ev.clientY, 0, ev.clientY-r.bottom);
            if(Math.hypot(dx,dy)<=opts.snapBuffer){ zone=open; match=true; }
          } else {
            // Non-positional matching (e.g. rebuild pieces already labeled by caption,
            // or capstone bins): each principle maps to exactly one open zone, so any
            // release within the containing card is unambiguous — don't require
            // pixel-precision. Prefer #stage when present, else fall back to the
            // nearest .card ancestor so this works on screens without a stage.
            const containerEl = document.getElementById('stage') || open.closest('.card');
            if(containerEl){
              const cr = containerEl.getBoundingClientRect();
              const inContainer = ev.clientX>=cr.left && ev.clientX<=cr.right && ev.clientY>=cr.top && ev.clientY<=cr.bottom;
              if(inContainer){ zone=open; match=true; }
            }
          }
        }
      }
      if(match){
        if(zone.dataset.origHtml!==undefined) delete zone.dataset.origHtml;
        ph.remove();
        onCorrect(piece, zone);
      } else {
        parent.insertBefore(piece, next && next.parentNode ? next : null);
        ph.remove();
        piece.classList.add('shake');
        setTimeout(()=>piece.classList.remove('shake'),400);
      }
    }
    piece.addEventListener('pointermove', move);
    piece.addEventListener('pointerup', up);
    piece.addEventListener('pointercancel', cancel);
    piece.addEventListener('lostpointercapture', cancel);
  });
}

/* ---------- Wire up per screen ---------- */
function wireUp(){
  if(state.screen==='intro'){
    document.getElementById('start-btn').onclick=()=>{ state.screen='diagnose'; render(); };
  }
  if(state.screen==='diagnose'){
    const r = ROUNDS[state.round];
    const stage = document.getElementById('stage');
    document.querySelectorAll('#advisor-tray .piece').forEach(piece=>{
      enableDrag(piece, (pc, zone)=>{
        const principle = pc.dataset.principle;
        state.solvedPins.add(r.id+':'+principle);
        state.activePrinciple = null;
        pc.remove();
        render();
      }, {onTap:(pc)=>showAdvisorPopup(pc.dataset.principle), snapBuffer:30});
    });
    document.querySelectorAll('.pin, .pin-zone').forEach(pin=>{
      const principle = pin.dataset.principle;
      function on(){ state.activePrinciple=principle; if(stage) applySpotlight(stage, r, principle); }
      function off(){ if(state.activePrinciple===principle){ state.activePrinciple=null; if(stage) applySpotlight(stage, r, null); } }
      pin.addEventListener('mouseenter', on);
      pin.addEventListener('mouseleave', off);
      pin.addEventListener('click', ()=>{
        if(state.activePrinciple===principle) off(); else on();
      });
    });
    const rb = document.getElementById('rebuild-btn');
    if(rb) rb.onclick=()=>{
      if(rb.disabled) return;
      state.activePrinciple = null;
      if(r.messyImage){
        state.completedStages[r.id] = `<div class="stage" id="stage" style="aspect-ratio:${r.imageAspect||'1/1'};"><img class="messy-bg" src="${r.afterImage}" alt="${r.name} finished"></div>`;
        state.screen='reveal';
      } else {
        state.phase='rebuild'; state.screen='rebuild';
        state.filledZones = new Set([...state.filledZones]);
        state.aligned=false;
      }
      render();
    };
  }
  if(state.screen==='critique'){
    const r = ROUNDS[state.round];
    if(!state.critiqueSubmitted){
      const minLen = 25;
      const btn = document.getElementById('critique-submit-btn');
      document.querySelectorAll('.critique-input').forEach(ta=>{
        const p = ta.dataset.principle;
        ta.oninput = ()=>{
          state.critiqueTexts[p] = ta.value;
          const len = ta.value.trim().length;
          const counter = document.querySelector('.critique-counter[data-principle="'+p+'"]');
          if(counter) counter.textContent = len+'/'+minLen+' characters';
          if(btn) btn.disabled = !ORDER.every(pp=>state.critiqueTexts[pp].trim().length>=minLen);
        };
      });
      if(btn) btn.onclick=()=>{
        if(btn.disabled) return;
        state.critiqueSubmitted = true;
        state.completedStages[r.id] = `<div class="stage" id="stage" style="aspect-ratio:${r.imageAspect};"><img class="messy-bg" src="${r.critiqueImage}" alt="Cup label"></div>`;
        state.badgesEarned.add('contrast'); state.badgesEarned.add('proximity');
        state.badgesEarned.add('repetition'); state.badgesEarned.add('alignment');
        state.roundsCompleted = Math.max(state.roundsCompleted, state.round+1);
        render();
      };
    } else {
      const cb = document.getElementById('critique-continue-btn');
      if(cb) cb.onclick=()=>{ state.screen='certificate'; render(); };
    }
  }
  if(state.screen==='rebuild'){
    const r = ROUNDS[state.round];
    document.querySelectorAll('#piece-tray .piece').forEach(piece=>{
      enableDrag(piece, (pc, zone)=>{
        zone.classList.add('filled');
        zone.innerHTML='';
        zone.appendChild(pc);
        pc.classList.add('placed');
        pc.style.position='static';
        state.filledZones.add(zone.dataset.zid);
        // handle nested proximity slot (menu round)
        if(r.nestedProximity && pc.dataset.principle===r.nestedProximity.parentPrincipleAsPlacedIn){
          const slot = pc.querySelector(r.nestedProximity.slotSelector);
          if(slot){
            slot.classList.add('dropzone');
            slot.dataset.principle='proximity';
            slot.dataset.zid=r.id+':proximity';
            slot.style.display='inline-block';
            slot.style.minWidth='30px';
            slot.style.border='2px dashed #c9bfa6';
            slot.style.borderRadius='6px';
            slot.style.padding='0 4px';
            enableDrag(document.getElementById('nested-price-piece')||makeNestedPricePiece(r), (pc2, zone2)=>{
              zone2.classList.add('filled');
              zone2.style.border='none';
              zone2.style.minWidth='0';
              zone2.style.padding='0';
              zone2.textContent='';
              zone2.appendChild(pc2);
              pc2.classList.add('placed');
              pc2.style.position='static';
              pc2.style.display='inline';
              pc2.style.padding='0';
              pc2.style.margin='0 0 0 3px';
              pc2.style.background='none';
              pc2.style.boxShadow='none';
              pc2.style.border='none';
              pc2.style.borderRadius='0';
              pc2.style.cursor='default';
              state.filledZones.add(zone2.dataset.zid);
              refreshRebuildUI();
            }, {preview:true});
          }
        }
        refreshRebuildUI();
      }, {preview:true});
    });
    const alignBtn=document.getElementById('align-btn');
    if(alignBtn) alignBtn.onclick=()=>{
      state.aligned=true;
      document.getElementById('stage').classList.add('aligned');
      alignBtn.textContent='✓ Aligned to grid';
      alignBtn.disabled=true;
      refreshRebuildUI();
    };
    const nextBtn=document.getElementById('next-round-btn');
    if(nextBtn) nextBtn.onclick=()=>{
      if(nextBtn.disabled) return;
      const r = ROUNDS[state.round];
      const stageEl = document.getElementById('stage');
      if(stageEl) state.completedStages[r.id] = stageEl.outerHTML;
      state.screen='reveal';
      render();
    };
  }
  if(state.screen==='reveal'){
    const r = ROUNDS[state.round];
    const stageEl = document.querySelector('.reveal-frame .stage');
    if(stageEl) stageEl.classList.add('reveal');
    state.badgesEarned.add('contrast'); state.badgesEarned.add('proximity');
    state.badgesEarned.add('repetition'); state.badgesEarned.add('alignment');
    state.roundsCompleted = Math.max(state.roundsCompleted, state.round+1);
    if(r.quiz){
      document.querySelectorAll('.quiz-block').forEach(block=>{
        const qi = parseInt(block.dataset.qi,10);
        const q = r.quiz[qi];
        if(state.quizSolved.has(r.id+':'+q.principle)) return;
        block.querySelectorAll('.quiz-opt').forEach((btn,oi)=>{
          btn.onclick=()=>{
            if(q.options[oi].correct){
              state.quizSolved.add(r.id+':'+q.principle);
              render();
            } else {
              btn.classList.add('wrong');
              setTimeout(()=>btn.classList.remove('wrong'),500);
            }
          };
        });
      });
    }
    document.getElementById('reveal-continue-btn').onclick=()=>{
      if(document.getElementById('reveal-continue-btn').disabled) return;
      if(state.round===0){
        state.round=1; state.aligned=false; state.activePrinciple=null; state.screen='diagnose';
      } else {
        state.screen='capstone';
      }
      render();
    };
  }
  if(state.screen==='capstone'){
    document.querySelectorAll('#capstone-tray .piece').forEach(chip=>{
      enableDrag(chip, (pc, zone)=>{
        state.capstoneSolved.add(pc.dataset.id);
        render();
      });
    });
    const cb = document.getElementById('capstone-continue-btn');
    if(cb) cb.onclick=()=>{
      if(cb.disabled) return;
      state.round=2; state.screen='critique';
      render();
    };
  }
  if(state.screen==='certificate'){
    document.getElementById('copy-btn').onclick=()=>{
      const text = document.getElementById('reflection').value;
      const cupSection = ORDER.map(p=>{
        const P = PRINCIPLES[p];
        return P.advisor+' ('+P.name+'): '+(state.critiqueTexts[p]||'').trim();
      }).join('\n\n');
      const full = "Chillwater Village Grand Opening Charter\n\n"
        +"My notes to Walt on the Cup Label:\n"+cupSection
        +"\n\nReflection:\n"+text;
      navigator.clipboard && navigator.clipboard.writeText(full);
      const btn=document.getElementById('copy-btn');
      const old=btn.textContent; btn.textContent='Copied!';
      setTimeout(()=>btn.textContent=old,1500);
    };
    document.getElementById('restart-btn').onclick=()=>{
      state.screen='intro'; state.round=0; state.phase='diagnose';
      state.solvedPins=new Set(); state.filledZones=new Set(); state.aligned=false;
      state.badgesEarned=new Set(); state.roundsCompleted=0; state.completedStages={}; state.quizSolved=new Set(); state.activePrinciple=null; state.capstoneSolved=new Set(); state.critiqueTexts={contrast:'',proximity:'',repetition:'',alignment:''}; state.critiqueSubmitted=false; state.capstoneOrder=null;
      render();
    };
  }
}

function makeNestedPricePiece(r){
  const el=document.createElement('div');
  el.id='nested-price-piece';
  el.className='piece';
  el.dataset.principle='proximity';
  el.style.cssText='font-weight:800; font-size:13px; display:inline-flex;';
  el.textContent='$9';
  document.getElementById('piece-tray').appendChild(el);
  return el;
}

function refreshRebuildUI(){
  const r = ROUNDS[state.round];
  const filledCount = [...state.filledZones].filter(z=>z.startsWith(r.id+':')).length;
  const requiredZones = r.rebuildZones.length + (r.nestedProximity?1:0);
  const roundDone = filledCount>=requiredZones && state.aligned;
  const nextBtn=document.getElementById('next-round-btn');
  if(nextBtn) nextBtn.disabled = !roundDone;
  const bannerParent = nextBtn ? nextBtn.closest('.card') : null;
  if(roundDone && bannerParent && !bannerParent.querySelector('.banner')){
    const b=document.createElement('div');
    b.className='banner';
    b.textContent='The '+r.name.toLowerCase()+' is ready for opening day!';
    nextBtn.closest('.nav-row').insertAdjacentElement('beforebegin', b);
    const stage=document.getElementById('stage');
    if(stage){
      stage.classList.add('reveal');
      stage.addEventListener('animationend', ()=>stage.classList.remove('reveal'), {once:true});
    }
  }
}

render();
</script>
</body>
</html>
